name: "🎮 Playit + Counter-Strike 1.6 Vanilla"

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # 🎮 SERVER
      # ============================================================

      hostname:
        name: "🏷️ Server Hostname"
        description: "نام سرور در Server Browser."
        required: true
        default: "🎮 CS 1.6 Vanilla | Playit"
        type: string

      start_map:
        name: "🗺️ Start Map"
        description: "Map اولیه، مثل de_dust2."
        required: true
        default: "de_dust2"
        type: string

      maxplayers:
        name: "👥 Max Players"
        description: "حداکثر بازیکنان. محدوده 1 تا 32."
        required: true
        default: 16
        type: number

      # ============================================================
      # ⚙️ GAMEPLAY
      # ============================================================

      roundtime:
        name: "⏱️ Round Time"
        description: "مدت Round بر حسب دقیقه."
        required: true
        default: 5
        type: number

      freezetime:
        name: "❄️ Freeze Time"
        description: "زمان Freeze ابتدای Round بر حسب ثانیه."
        required: true
        default: 3
        type: number

      buytime:
        name: "💰 Buy Time"
        description: "زمان خرید بر حسب دقیقه."
        required: true
        default: 0.25
        type: number

      startmoney:
        name: "💵 Start Money"
        description: "پول اولیه بازیکنان."
        required: true
        default: 800
        type: number

      friendlyfire:
        name: "🔫 Friendly Fire"
        description: "آسیب به هم‌تیمی‌ها."
        required: true
        default: false
        type: boolean

      footsteps:
        name: "👣 Footsteps"
        description: "صدای قدم‌ها."
        required: true
        default: true
        type: boolean

      limitteams:
        name: "⚖️ Team Limit"
        description: "حداکثر اختلاف تعداد بازیکنان دو تیم."
        required: true
        default: 2
        type: number

      autoteambalance:
        name: "⚖️ Auto Team Balance"
        description: "متعادل‌سازی خودکار تیم‌ها."
        required: true
        default: true
        type: boolean

      tkpunish:
        name: "☠️ Team Kill Punishment"
        description: "مجازات Team Kill."
        required: true
        default: false
        type: boolean

      c4timer:
        name: "💣 C4 Timer"
        description: "زمان انفجار C4 بر حسب ثانیه."
        required: true
        default: 35
        type: number

      forcechasecam:
        name: "👁️ Force Chase Camera"
        description: "حالت محدودیت دوربین Spectator."
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"

      # ============================================================
      # 🎙️ VOICE
      # ============================================================

      voiceenable:
        name: "🎙️ Voice Chat"
        description: "فعال بودن Voice Chat."
        required: true
        default: true
        type: boolean

      alltalk:
        name: "📢 All Talk"
        description: "ارتباط صوتی بین بازیکنان تیم‌ها و Spectator."
        required: true
        default: false
        type: boolean

      # ============================================================
      # 🌐 NETWORK
      # ============================================================

      maxrate:
        name: "📡 sv_maxrate"
        description: "حداکثر network rate."
        required: true
        default: 25000
        type: number

      minrate:
        name: "📡 sv_minrate"
        description: "حداقل network rate."
        required: true
        default: 2500
        type: number

      maxupdaterate:
        name: "📡 sv_maxupdaterate"
        description: "حداکثر update rate."
        required: true
        default: 101
        type: number

      minupdaterate:
        name: "📡 sv_minupdaterate"
        description: "حداقل update rate."
        required: true
        default: 20
        type: number

      unlag:
        name: "🛰️ sv_unlag"
        description: "فعال بودن Lag Compensation."
        required: true
        default: true
        type: boolean

      maxunlag:
        name: "🛰️ sv_maxunlag"
        description: "حداکثر زمان Lag Compensation."
        required: true
        default: 0.5
        type: number

      sys_ticrate:
        name: "⚙️ sys_ticrate"
        description: "نرخ پردازش HLDS. محدوده 10 تا 1000."
        required: true
        default: 1000
        type: number

      # ============================================================
      # 📜 LOGGING
      # ============================================================

      logdetail:
        name: "📜 mp_logdetail"
        description: "سطح جزئیات Player Logging."
        required: true
        default: "3"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"

      # ============================================================
      # 🧩 ADVANCED VANILLA CVARS
      # ============================================================

      extra_cvars:
        name: "🧩 Advanced Vanilla CVars"
        description: "CVarهای اضافی را با ; جدا کنید. مثال: mp_timelimit 30;mp_flashlight 1"
        required: false
        default: ""
        type: string


# ================================================================
# 🔒 CONCURRENCY
# ================================================================
# جلوگیری از اجرای هم‌زمان دو Agent با یک Playit Secret.
# ================================================================

concurrency:
  group: "cs16-playit-server"
  cancel-in-progress: false


jobs:

  playit_cs16:

    name: "🎮 Playit + CS 1.6 Vanilla"

    runs-on: ubuntu-24.04

    # GitHub-hosted runner hard limit.
    timeout-minutes: 360

    permissions:
      contents: read

    env:

      # ============================================================
      # 🔒 FIXED LOCAL ORIGIN
      # ============================================================

      CS_IP: "127.0.0.1"
      CS_PORT: "27015"

      # ============================================================
      # 📂 PATHS
      # ============================================================

      CS_INSTALL_DIR: "/opt/cs16"
      PLAYIT_CONFIG_DIR: "/etc/playit"
      PLAYIT_CONFIG_FILE: "/etc/playit/playit.toml"

      # ============================================================
      # ⏱️ RUNTIME
      # ============================================================
      # 330 minutes runtime + ~30 minutes safety margin
      # inside the 360-minute GitHub-hosted runner limit.
      # ============================================================

      MAX_RUNTIME_MINUTES: "330"


    steps:

      # ============================================================
      # 1️⃣ SYSTEM INFORMATION
      # ============================================================

      - name: "1️⃣ 🖥️ System Information"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================================="
          echo "🖥️ SYSTEM INFORMATION"
          echo "=============================================================="

          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          lscpu | sed -n '1,25p'

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Network:"
          ip -br addr

          echo
          echo "=============================================================="


      # ============================================================
      # 2️⃣ VALIDATE INPUTS
      # ============================================================

      - name: "2️⃣ 🔎 Validate Server Configuration"
        shell: bash
        env:
          HOSTNAME_INPUT: ${{ inputs.hostname }}
          MAP_INPUT: ${{ inputs.start_map }}
          MAXPLAYERS_INPUT: ${{ inputs.maxplayers }}
          ROUNDTIME_INPUT: ${{ inputs.roundtime }}
          FREEZETIME_INPUT: ${{ inputs.freezetime }}
          BUYTIME_INPUT: ${{ inputs.buytime }}
          STARTMONEY_INPUT: ${{ inputs.startmoney }}
          LIMITTEAMS_INPUT: ${{ inputs.limitteams }}
          C4TIMER_INPUT: ${{ inputs.c4timer }}
          MAXRATE_INPUT: ${{ inputs.maxrate }}
          MINRATE_INPUT: ${{ inputs.minrate }}
          MAXUPDATERATE_INPUT: ${{ inputs.maxupdaterate }}
          MINUPDATERATE_INPUT: ${{ inputs.minupdaterate }}
          MAXUNLAG_INPUT: ${{ inputs.maxunlag }}
          SYSTICRATE_INPUT: ${{ inputs.sys_ticrate }}
          FORCECHASECAM_INPUT: ${{ inputs.forcechasecam }}
          LOGDETAIL_INPUT: ${{ inputs.logdetail }}
          EXTRA_CVARS_INPUT: ${{ inputs.extra_cvars }}

        run: |
          set -Eeuo pipefail

          echo "=============================================================="
          echo "🔎 VALIDATING CONFIGURATION"
          echo "=============================================================="

          # ----------------------------------------------------------
          # Hostname
          # ----------------------------------------------------------

          if [[ -z "$HOSTNAME_INPUT" ]]; then
            echo "❌ Hostname cannot be empty."
            exit 1
          fi

          if (( ${#HOSTNAME_INPUT} > 100 )); then
            echo "❌ Hostname is too long."
            echo "   Maximum: 100 characters."
            exit 1
          fi

          if [[ "$HOSTNAME_INPUT" =~ [[:cntrl:]] ||
                "$HOSTNAME_INPUT" == *'"'* ||
                "$HOSTNAME_INPUT" == *'\'* ||
                "$HOSTNAME_INPUT" == *';'* ]]; then
            echo "❌ Hostname contains unsupported characters."
            exit 1
          fi

          # ----------------------------------------------------------
          # Map
          # ----------------------------------------------------------

          if [[ -z "$MAP_INPUT" ||
                ! "$MAP_INPUT" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "❌ Invalid map name."
            echo "   Allowed: A-Z, a-z, 0-9 and _"
            exit 1
          fi

          if (( ${#MAP_INPUT} > 64 )); then
            echo "❌ Map name is too long."
            exit 1
          fi

          # ----------------------------------------------------------
          # Max Players
          # ----------------------------------------------------------

          if ! [[ "$MAXPLAYERS_INPUT" =~ ^[0-9]+$ ]]; then
            echo "❌ Max Players must be an integer."
            exit 1
          fi

          if (( MAXPLAYERS_INPUT < 1 || MAXPLAYERS_INPUT > 32 )); then
            echo "❌ Max Players must be between 1 and 32."
            exit 1
          fi

          # ----------------------------------------------------------
          # Numeric syntax
          # ----------------------------------------------------------

          if ! [[ "$ROUNDTIME_INPUT" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ Invalid Round Time."
            exit 1
          fi

          if ! [[ "$FREEZETIME_INPUT" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ Invalid Freeze Time."
            exit 1
          fi

          if ! [[ "$BUYTIME_INPUT" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ Invalid Buy Time."
            exit 1
          fi

          if ! [[ "$STARTMONEY_INPUT" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid Start Money."
            exit 1
          fi

          if ! [[ "$LIMITTEAMS_INPUT" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid Team Limit."
            exit 1
          fi

          if ! [[ "$C4TIMER_INPUT" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid C4 Timer."
            exit 1
          fi

          if ! [[ "$MAXRATE_INPUT" =~ ^[0-9]+$ &&
                  "$MINRATE_INPUT" =~ ^[0-9]+$ &&
                  "$MAXUPDATERATE_INPUT" =~ ^[0-9]+$ &&
                  "$MINUPDATERATE_INPUT" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid network rate."
            exit 1
          fi

          if ! [[ "$MAXUNLAG_INPUT" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ Invalid sv_maxunlag."
            exit 1
          fi

          if ! [[ "$SYSTICRATE_INPUT" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid sys_ticrate."
            exit 1
          fi

          if ! [[ "$FORCECHASECAM_INPUT" =~ ^[012]$ ]]; then
            echo "❌ Invalid mp_forcechasecam."
            exit 1
          fi

          if ! [[ "$LOGDETAIL_INPUT" =~ ^[0123]$ ]]; then
            echo "❌ Invalid mp_logdetail."
            exit 1
          fi

          # ----------------------------------------------------------
          # Semantic ranges
          # ----------------------------------------------------------

          if (( $(awk -v v="$ROUNDTIME_INPUT" 'BEGIN {print (v < 1 || v > 9)}') )); then
            echo "❌ Round Time must be between 1 and 9 minutes."
            exit 1
          fi

          if (( $(awk -v v="$FREEZETIME_INPUT" 'BEGIN {print (v < 0 || v > 60)}') )); then
            echo "❌ Freeze Time must be between 0 and 60 seconds."
            exit 1
          fi

          if (( $(awk -v v="$BUYTIME_INPUT" 'BEGIN {print (v < 0 || v > 9)}') )); then
            echo "❌ Buy Time must be between 0 and 9 minutes."
            exit 1
          fi

          if (( STARTMONEY_INPUT < 800 || STARTMONEY_INPUT > 16000 )); then
            echo "❌ Start Money must be between 800 and 16000."
            exit 1
          fi

          if (( LIMITTEAMS_INPUT < 0 || LIMITTEAMS_INPUT > 32 )); then
            echo "❌ Team Limit must be between 0 and 32."
            exit 1
          fi

          if (( C4TIMER_INPUT < 15 || C4TIMER_INPUT > 90 )); then
            echo "❌ C4 Timer must be between 15 and 90 seconds."
            exit 1
          fi

          if (( MAXRATE_INPUT < MINRATE_INPUT )); then
            echo "❌ sv_maxrate cannot be lower than sv_minrate."
            exit 1
          fi

          if (( MINRATE_INPUT < 0 || MAXRATE_INPUT > 100000 )); then
            echo "❌ Network rate must be between 0 and 100000."
            exit 1
          fi

          if (( MINUPDATERATE_INPUT < 1 ||
                MAXUPDATERATE_INPUT < MINUPDATERATE_INPUT ||
                MAXUPDATERATE_INPUT > 102 )); then
            echo "❌ Update rate must be between 1 and 102."
            exit 1
          fi

          if (( $(awk -v v="$MAXUNLAG_INPUT" 'BEGIN {print (v < 0 || v > 1)}') )); then
            echo "❌ sv_maxunlag must be between 0 and 1 second."
            exit 1
          fi

          if (( SYSTICRATE_INPUT < 10 || SYSTICRATE_INPUT > 1000 )); then
            echo "❌ sys_ticrate must be between 10 and 1000."
            exit 1
          fi

          # ----------------------------------------------------------
          # Advanced CVars
          # ----------------------------------------------------------

          if [[ -n "$EXTRA_CVARS_INPUT" ]]; then

            IFS=';' read -ra CVARS <<< "$EXTRA_CVARS_INPUT"

            for ENTRY in "${CVARS[@]}"; do

              ENTRY="$(printf '%s' "$ENTRY" |
                sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

              [[ -z "$ENTRY" ]] && continue

              if [[ "$ENTRY" =~ [[:cntrl:]] ]]; then
                echo "❌ Advanced CVar contains control characters."
                exit 1
              fi

              if (( ${#ENTRY} > 200 )); then
                echo "❌ Advanced CVar entry is too long."
                exit 1
              fi

              if [[ "$ENTRY" == *'"'* ||
                    "$ENTRY" == *"'"* ||
                    "$ENTRY" == *'\'* ]]; then
                echo "❌ Advanced CVar contains unsupported quote characters."
                exit 1
              fi

              if [[ ! "$ENTRY" =~ ^(mp_[A-Za-z0-9_]+|sv_[A-Za-z0-9_]+|allow_spectators|decalfrequency|edgefriction|host_framerate|pausable|log)[[:space:]]+[^[:cntrl:];[:space:]]+$ ]]; then
                echo "❌ Invalid Advanced CVar:"
                echo "   $ENTRY"
                exit 1
              fi

              if [[ "$ENTRY" =~ (^|[[:space:]])(exec|quit|exit|alias|bind|unbind|rcon|changelevel|map|restart|shutdown|writeid|writeip|_restart)([[:space:]]|$) ]]; then
                echo "❌ Server command is not allowed:"
                echo "   $ENTRY"
                exit 1
              fi

              if [[ "$ENTRY" == *'&&'* ||
                    "$ENTRY" == *'||'* ||
                    "$ENTRY" == *'>>'* ||
                    "$ENTRY" == *'>'* ||
                    "$ENTRY" == *'<'* ||
                    "$ENTRY" == *'$('* ||
                    "$ENTRY" == *'`'* ]]; then
                echo "❌ Unsupported command syntax in Advanced CVar:"
                echo "   $ENTRY"
                exit 1
              fi

              CVAR_NAME="${ENTRY%%[[:space:]]*}"

              case "$CVAR_NAME" in
                *password*|*passwd*|*rcon*|*auth*|*token*|*secret*)
                  echo "❌ Secret/authentication-related CVars are not allowed:"
                  echo "   $CVAR_NAME"
                  exit 1
                  ;;
              esac

            done
          fi

          echo
          echo "✅ Configuration is valid."


      # ============================================================
      # 3️⃣ INSTALL DEPENDENCIES
      # ============================================================

      - name: "3️⃣ 📦 Install Dependencies"
        shell: bash
        run: |
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            iproute2 \
            procps \
            steamcmd \
            util-linux

          command -v curl
          command -v gpg
          command -v ss
          command -v steamcmd
          command -v timeout

          echo
          echo "Architecture:"
          dpkg --print-architecture
          dpkg --print-foreign-architectures

          echo
          echo "SteamCMD:"
          steamcmd +quit

          echo
          echo "✅ Dependencies installed."


      # ============================================================
      # 4️⃣ CONFIGURE PLAYIT REPOSITORY
      # ============================================================

      - name: "4️⃣ 🎮 Configure Playit Repository"
        shell: bash
        run: |
          set -Eeuo pipefail

          PLAYIT_KEYRING="/etc/apt/trusted.gpg.d/playit.gpg"
          PLAYIT_SOURCE="/etc/apt/sources.list.d/playit-cloud.list"

          curl -fsSL \
            https://playit-cloud.github.io/ppa/key.gpg |
            gpg --dearmor |
            sudo tee "$PLAYIT_KEYRING" >/dev/null

          sudo chmod 0644 "$PLAYIT_KEYRING"

          echo \
            "deb [signed-by=$PLAYIT_KEYRING] https://playit-cloud.github.io/ppa/data ./" |
            sudo tee "$PLAYIT_SOURCE" >/dev/null

          sudo apt-get update

          echo "✅ Playit repository configured."


      # ============================================================
      # 5️⃣ INSTALL PLAYIT
      # ============================================================

      - name: "5️⃣ 📥 Install Playit"
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get install -y playit

          if ! command -v playit >/dev/null 2>&1; then
            echo "❌ Playit executable was not installed."
            exit 1
          fi

          echo "Playit version:"
          playit version

          echo
          echo "Playit service:"
          sudo systemctl cat playit --no-pager

          echo
          echo "✅ Playit installed."


      # ============================================================
      # 6️⃣ CONFIGURE PLAYIT SECRET
      # ============================================================

      - name: "6️⃣ 🔐 Configure Playit Secret"
        shell: bash
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}

        run: |
          set -Eeuo pipefail

          if [[ -z "${PLAYIT_SECRET_KEY:-}" ]]; then
            echo "❌ GitHub Secret PLAYIT_SECRET_KEY is missing."
            exit 1
          fi

          if [[ "$PLAYIT_SECRET_KEY" =~ [[:cntrl:]] ]]; then
            echo "❌ PLAYIT_SECRET_KEY contains unsupported control characters."
            exit 1
          fi

          if [[ ! "$PLAYIT_SECRET_KEY" =~ ^[A-Za-z0-9_-]{32,256}$ ]]; then
            echo "❌ PLAYIT_SECRET_KEY has an invalid format."
            exit 1
          fi

          sudo install \
            -d \
            -o playit \
            -g playit \
            -m 0750 \
            "$PLAYIT_CONFIG_DIR"

          TMP_FILE="$(mktemp)"

          cleanup_tmp() {
            rm -f "$TMP_FILE"
          }

          trap cleanup_tmp EXIT

          ESCAPED_SECRET="${PLAYIT_SECRET_KEY//\\/\\\\}"
          ESCAPED_SECRET="${ESCAPED_SECRET//\"/\\\"}"

          printf 'secret_key = "%s"\n' \
            "$ESCAPED_SECRET" > "$TMP_FILE"

          sudo install \
            -o playit \
            -g playit \
            -m 0600 \
            "$TMP_FILE" \
            "$PLAYIT_CONFIG_FILE"

          unset PLAYIT_SECRET_KEY
          unset ESCAPED_SECRET

          echo "✅ Playit secret configured."

          sudo stat \
            -c 'Path=%n Owner=%U:%G Mode=%a Size=%s' \
            "$PLAYIT_CONFIG_FILE"


      # ============================================================
      # 7️⃣ START + VERIFY PLAYIT
      # ============================================================

      - name: "7️⃣ 🚇 Start and Verify Playit Tunnel"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================================="
          echo "🚇 STARTING PLAYIT"
          echo "=============================================================="

          sudo systemctl daemon-reload
          sudo systemctl enable playit
          sudo systemctl restart playit

          PLAYIT_READY=0

          for attempt in {1..45}; do

            if ! sudo systemctl is-active --quiet playit; then
              echo "⏳ Playit service is not active ($attempt/45)..."
              sleep 2
              continue
            fi

            if ! sudo test -s "$PLAYIT_CONFIG_FILE"; then
              echo "❌ Playit secret file disappeared."
              exit 1
            fi

            if sudo journalctl \
              -u playit \
              --no-pager \
              -n 100 2>/dev/null |
              grep -Eq 'playit connected; tunnels loaded|playit tunnel state updated'; then

              PLAYIT_READY=1
              echo "✅ Playit agent connected to the control plane."
              break
            fi

            echo "⏳ Waiting for Playit agent/tunnel state ($attempt/45)..."
            sleep 2

          done

          if (( PLAYIT_READY == 0 )); then

            echo "❌ Playit did not report a connected tunnel state."

            echo
            echo "Service status:"
            sudo systemctl status playit \
              --no-pager \
              --full || true

            echo
            echo "Playit journal:"
            sudo journalctl \
              -u playit \
              --no-pager \
              -n 200 || true

            exit 1
          fi

          echo
          echo "Recent Playit journal:"
          sudo journalctl \
            -u playit \
            --no-pager \
            -n 80 || true

          echo
          echo "=============================================================="
          echo "✅ PLAYIT AGENT READY"
          echo "=============================================================="


      # ============================================================
      # 8️⃣ INSTALL VANILLA HLDS / CS 1.6
      # ============================================================

      - name: "8️⃣ 🎮 Install Vanilla Counter-Strike 1.6 Server"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================================="
          echo "🎮 INSTALLING VANILLA HLDS"
          echo "=============================================================="

          sudo mkdir -p "$CS_INSTALL_DIR"
          sudo chown "$USER:$USER" "$CS_INSTALL_DIR"

          steamcmd \
            +force_install_dir "$CS_INSTALL_DIR" \
            +login anonymous \
            +app_set_config 90 mod cstrike \
            +app_update 90 validate \
            +quit

          if [[ ! -x "$CS_INSTALL_DIR/hlds_run" ]]; then
            echo "❌ hlds_run not found."
            exit 1
          fi

          if [[ ! -x "$CS_INSTALL_DIR/hlds_linux" ]]; then
            echo "❌ hlds_linux not found."
            exit 1
          fi

          if [[ ! -d "$CS_INSTALL_DIR/cstrike" ]]; then
            echo "❌ cstrike directory not found."
            exit 1
          fi

          echo
          echo "Installed size:"
          du -sh "$CS_INSTALL_DIR"

          echo
          echo "Disk:"
          df -h /

          echo
          echo "✅ Vanilla HLDS installed."


      # ============================================================
      # 9️⃣ VALIDATE START MAP
      # ============================================================

      - name: "9️⃣ 🗺️ Validate Start Map"
        shell: bash
        env:
          MAP_INPUT: ${{ inputs.start_map }}

        run: |
          set -Eeuo pipefail

          MAP_FILE="$CS_INSTALL_DIR/cstrike/maps/${MAP_INPUT}.bsp"

          if [[ ! -f "$MAP_FILE" ]]; then
            echo "❌ Map does not exist:"
            echo "   $MAP_INPUT"
            echo
            echo "Expected:"
            echo "   $MAP_FILE"
            exit 1
          fi

          echo "✅ Map found: $MAP_INPUT"


      # ============================================================
      # 🔟 GENERATE SERVER.CFG
      # ============================================================

      - name: "🔟 ⚙️ Generate Vanilla server.cfg"
        shell: bash
        env:
          HOSTNAME_INPUT: ${{ inputs.hostname }}
          ROUNDTIME_INPUT: ${{ inputs.roundtime }}
          FREEZETIME_INPUT: ${{ inputs.freezetime }}
          BUYTIME_INPUT: ${{ inputs.buytime }}
          STARTMONEY_INPUT: ${{ inputs.startmoney }}
          FRIENDLYFIRE_INPUT: ${{ inputs.friendlyfire }}
          FOOTSTEPS_INPUT: ${{ inputs.footsteps }}
          LIMITTEAMS_INPUT: ${{ inputs.limitteams }}
          AUTOTEAMBALANCE_INPUT: ${{ inputs.autoteambalance }}
          TKPUNISH_INPUT: ${{ inputs.tkpunish }}
          C4TIMER_INPUT: ${{ inputs.c4timer }}
          FORCECHASECAM_INPUT: ${{ inputs.forcechasecam }}
          VOICEENABLE_INPUT: ${{ inputs.voiceenable }}
          ALLTALK_INPUT: ${{ inputs.alltalk }}
          MAXRATE_INPUT: ${{ inputs.maxrate }}
          MINRATE_INPUT: ${{ inputs.minrate }}
          MAXUPDATERATE_INPUT: ${{ inputs.maxupdaterate }}
          MINUPDATERATE_INPUT: ${{ inputs.minupdaterate }}
          UNLAG_INPUT: ${{ inputs.unlag }}
          MAXUNLAG_INPUT: ${{ inputs.maxunlag }}
          SYSTICRATE_INPUT: ${{ inputs.sys_ticrate }}
          LOGDETAIL_INPUT: ${{ inputs.logdetail }}
          EXTRA_CVARS_INPUT: ${{ inputs.extra_cvars }}

        run: |
          set -Eeuo pipefail

          bool_to_int() {
            case "$1" in
              true)
                printf '1'
                ;;
              false)
                printf '0'
                ;;
              *)
                echo "❌ Invalid boolean value: $1" >&2
                return 1
                ;;
            esac
          }

          FRIENDLYFIRE="$(bool_to_int "$FRIENDLYFIRE_INPUT")"
          FOOTSTEPS="$(bool_to_int "$FOOTSTEPS_INPUT")"
          AUTOTEAMBALANCE="$(bool_to_int "$AUTOTEAMBALANCE_INPUT")"
          TKPUNISH="$(bool_to_int "$TKPUNISH_INPUT")"
          VOICEENABLE="$(bool_to_int "$VOICEENABLE_INPUT")"
          ALLTALK="$(bool_to_int "$ALLTALK_INPUT")"
          UNLAG="$(bool_to_int "$UNLAG_INPUT")"

          SERVER_CFG="$CS_INSTALL_DIR/cstrike/server.cfg"

          cat > "$SERVER_CFG" <<EOF
          // ============================================================
          // Counter-Strike 1.6 Vanilla
          // Generated by GitHub Actions
          // ============================================================

          hostname "$HOSTNAME_INPUT"

          // Fixed Playit origin
          ip "$CS_IP"
          port "$CS_PORT"
          sv_lan 0

          // Gameplay
          mp_roundtime "$ROUNDTIME_INPUT"
          mp_freezetime "$FREEZETIME_INPUT"
          mp_buytime "$BUYTIME_INPUT"
          mp_startmoney "$STARTMONEY_INPUT"
          mp_friendlyfire "$FRIENDLYFIRE"
          mp_footsteps "$FOOTSTEPS"
          mp_limitteams "$LIMITTEAMS_INPUT"
          mp_autoteambalance "$AUTOTEAMBALANCE"
          mp_tkpunish "$TKPUNISH"
          mp_c4timer "$C4TIMER_INPUT"
          mp_forcechasecam "$FORCECHASECAM_INPUT"

          // Voice
          sv_voiceenable "$VOICEENABLE"
          sv_alltalk "$ALLTALK"

          // Network
          sv_maxrate "$MAXRATE_INPUT"
          sv_minrate "$MINRATE_INPUT"
          sv_maxupdaterate "$MAXUPDATERATE_INPUT"
          sv_minupdaterate "$MINUPDATERATE_INPUT"
          sv_unlag "$UNLAG"
          sv_maxunlag "$MAXUNLAG_INPUT"

          // Server
          sys_ticrate "$SYSTICRATE_INPUT"

          // Logging
          log "on"
          mp_logdetail "$LOGDETAIL_INPUT"

          // Standard Vanilla settings
          pausable "0"
          sv_cheats "0"
          sv_allowdownload "1"
          sv_allowupload "1"
          sv_send_logos "1"
          sv_send_resources "1"
          decalfrequency "60"
          EOF

          if [[ -n "$EXTRA_CVARS_INPUT" ]]; then

            IFS=';' read -ra CVARS <<< "$EXTRA_CVARS_INPUT"

            {
              echo
              echo "// Advanced Vanilla CVars"

              for ENTRY in "${CVARS[@]}"; do

                ENTRY="$(printf '%s' "$ENTRY" |
                  sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

                [[ -z "$ENTRY" ]] && continue

                printf '%s\n' "$ENTRY"

              done

            } >> "$SERVER_CFG"

          fi

          chmod 0644 "$SERVER_CFG"

          echo "=============================================================="
          echo "📄 server.cfg"
          echo "=============================================================="

          cat "$SERVER_CFG"

          echo "=============================================================="


      # ============================================================
      # 1️⃣1️⃣ CHECK ORIGIN PORT
      # ============================================================

      - name: "1️⃣1️⃣ 🔌 Check Origin UDP Port"
        shell: bash
        run: |
          set -Eeuo pipefail

          if ss -H -lun |
            awk '{print $5}' |
            grep -Eq "(^|:)${CS_PORT}$"; then

            echo "❌ UDP $CS_PORT is already occupied."
            echo
            ss -lunp || true
            exit 1
          fi

          echo "✅ UDP $CS_PORT is available."


      # ============================================================
      # 1️⃣2️⃣ START HLDS + READINESS CHECK + RUNTIME MONITOR
      # ============================================================

      - name: "1️⃣2️⃣ 🚀 Start Vanilla HLDS"
        shell: bash
        env:
          MAP_INPUT: ${{ inputs.start_map }}
          MAXPLAYERS_INPUT: ${{ inputs.maxplayers }}

        run: |
          set -Eeuo pipefail

          cd "$CS_INSTALL_DIR"

          LOG_FILE="$CS_INSTALL_DIR/hlds-console.log"
          PID_FILE="$CS_INSTALL_DIR/hlds.pid"

          echo "=============================================================="
          echo "🎮 STARTING COUNTER-STRIKE 1.6"
          echo "=============================================================="
          echo
          echo "Game       : Counter-Strike 1.6"
          echo "Map        : $MAP_INPUT"
          echo "Players    : $MAXPLAYERS_INPUT"
          echo "Origin     : $CS_IP:$CS_PORT"
          echo "Protocol   : UDP"
          echo "Runtime    : ${MAX_RUNTIME_MINUTES} minutes"
          echo

          rm -f "$LOG_FILE" "$PID_FILE"

          ./hlds_run \
            -game cstrike \
            -ip "$CS_IP" \
            -port "$CS_PORT" \
            +maxplayers "$MAXPLAYERS_INPUT" \
            +map "$MAP_INPUT" \
            +sv_lan 0 \
            > "$LOG_FILE" 2>&1 &

          HLDS_LAUNCHER_PID=$!

          echo "$HLDS_LAUNCHER_PID" > "$PID_FILE"

          echo "HLDS launcher PID: $HLDS_LAUNCHER_PID"

          # ----------------------------------------------------------
          # Wait for HLDS to become ready.
          # ----------------------------------------------------------

          HLDS_READY=0

          for attempt in {1..45}; do

            if ss -H -lun |
              awk '{print $5}' |
              grep -Eq "(^|:)${CS_PORT}$"; then

              HLDS_READY=1
              echo "✅ HLDS is listening on UDP $CS_PORT."
              break
            fi

            if ! kill -0 "$HLDS_LAUNCHER_PID" 2>/dev/null; then
              echo "❌ HLDS launcher exited during startup."
              echo
              echo "Last 150 log lines:"
              tail -n 150 "$LOG_FILE" || true
              exit 1
            fi

            echo "⏳ Waiting for HLDS ($attempt/45)..."
            sleep 1

          done

          if (( HLDS_READY == 0 )); then

            echo "❌ HLDS did not open UDP $CS_PORT within 45 seconds."

            echo
            echo "Last 200 log lines:"
            tail -n 200 "$LOG_FILE" || true

            kill -TERM "$HLDS_LAUNCHER_PID" 2>/dev/null || true

            exit 1
          fi

          echo
          echo "=============================================================="
          echo "✅ HLDS READY"
          echo "=============================================================="

          # ----------------------------------------------------------
          # Runtime monitor.
          # This avoids relying on timeout/tail PID semantics.
          # ----------------------------------------------------------

          RUNTIME_SECONDS=$(( MAX_RUNTIME_MINUTES * 60 ))
          START_EPOCH="$(date +%s)"
          END_EPOCH=$(( START_EPOCH + RUNTIME_SECONDS ))

          echo
          echo "⏱️ Runtime monitor started."
          echo "   End timestamp: $END_EPOCH"

          while true; do

            NOW_EPOCH="$(date +%s)"

            # --------------------------------------------------------
            # HLDS exited unexpectedly.
            # --------------------------------------------------------

            if ! kill -0 "$HLDS_LAUNCHER_PID" 2>/dev/null; then

              echo "❌ HLDS exited unexpectedly."

              echo
              echo "Last 200 log lines:"
              tail -n 200 "$LOG_FILE" || true

              exit 1
            fi

            # --------------------------------------------------------
            # Planned runtime reached.
            # --------------------------------------------------------

            if (( NOW_EPOCH >= END_EPOCH )); then

              echo "✅ Planned runtime reached."

              break
            fi

            REMAINING=$(( END_EPOCH - NOW_EPOCH ))

            if (( REMAINING > 300 )); then
              sleep 30
            else
              sleep 5
            fi

          done

          # ----------------------------------------------------------
          # Graceful shutdown.
          # ----------------------------------------------------------

          echo "🛑 Sending SIGTERM to HLDS launcher..."

          kill -TERM "$HLDS_LAUNCHER_PID" 2>/dev/null || true

          for attempt in {1..10}; do

            if ! kill -0 "$HLDS_LAUNCHER_PID" 2>/dev/null; then
              echo "✅ HLDS stopped gracefully."
              exit 0
            fi

            sleep 1

          done

          echo "⚠️ HLDS did not stop after SIGTERM."

          kill -KILL "$HLDS_LAUNCHER_PID" 2>/dev/null || true

          sleep 2

          if kill -0 "$HLDS_LAUNCHER_PID" 2>/dev/null; then
            echo "❌ Unable to terminate HLDS launcher."
            exit 1
          fi

          echo "✅ HLDS terminated."


      # ============================================================
      # 1️⃣3️⃣ CLEANUP
      # ============================================================

      - name: "1️⃣3️⃣ 🧹 Cleanup"
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================================================="
          echo "🧹 CLEANUP"
          echo "=============================================================="

          # ----------------------------------------------------------
          # Stop HLDS using recorded launcher PID.
          # ----------------------------------------------------------

          if [[ -f "$CS_INSTALL_DIR/hlds.pid" ]]; then

            HLDS_PID="$(cat "$CS_INSTALL_DIR/hlds.pid" 2>/dev/null)"

            if [[ "$HLDS_PID" =~ ^[0-9]+$ ]]; then

              echo "HLDS launcher PID: $HLDS_PID"

              if kill -0 "$HLDS_PID" 2>/dev/null; then

                kill -TERM "$HLDS_PID" 2>/dev/null

                for _ in {1..5}; do
                  kill -0 "$HLDS_PID" 2>/dev/null || break
                  sleep 1
                done

                if kill -0 "$HLDS_PID" 2>/dev/null; then
                  kill -KILL "$HLDS_PID" 2>/dev/null
                fi

              fi

            fi

          fi

          # ----------------------------------------------------------
          # Fallback: stop only HLDS processes from this installation.
          # ----------------------------------------------------------

          pkill -TERM -f "$CS_INSTALL_DIR/hlds_linux" 2>/dev/null
          pkill -TERM -f "$CS_INSTALL_DIR/hlds_run" 2>/dev/null

          sleep 2

          pkill -KILL -f "$CS_INSTALL_DIR/hlds_linux" 2>/dev/null
          pkill -KILL -f "$CS_INSTALL_DIR/hlds_run" 2>/dev/null

          # ----------------------------------------------------------
          # Stop Playit.
          # ----------------------------------------------------------

          sudo systemctl stop playit 2>/dev/null

          echo
          echo "🎮 Playit:"
          sudo systemctl status playit \
            --no-pager \
            --full \
            2>/dev/null || true

          echo
          echo "🔌 UDP sockets:"
          ss -lunp || true

          echo
          echo "🎮 HLDS processes:"
          ps aux | grep -E '[h]lds_(run|linux)' || true

          echo
          echo "=============================================================="
          echo "🧹 CLEANUP COMPLETE"
          echo "=============================================================="


      # ============================================================
      # 1️⃣4️⃣ FINAL FAILURE LOG
      # ============================================================

      - name: "1️⃣4️⃣ 📜 Show Diagnostic Logs On Failure"
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=============================================================="
          echo "📜 FAILURE DIAGNOSTICS"
          echo "=============================================================="

          echo
          echo "---------------- PLAYIT SERVICE ----------------"

          sudo systemctl status playit \
            --no-pager \
            --full || true

          echo
          echo "---------------- PLAYIT JOURNAL ----------------"

          sudo journalctl \
            -u playit \
            --no-pager \
            -n 250 || true

          echo
          echo "---------------- HLDS LOG ----------------"

          if [[ -f "$CS_INSTALL_DIR/hlds-console.log" ]]; then
            tail -n 250 \
              "$CS_INSTALL_DIR/hlds-console.log"
          else
            echo "HLDS log file does not exist."
          fi

          echo
          echo "---------------- UDP SOCKETS ----------------"

          ss -lunp || true

          echo
          echo "---------------- PROCESSES ----------------"

          ps aux | grep -E '[p]layit|[h]lds_(run|linux)' || true

          echo
          echo "---------------- DISK ----------------"

          df -h / || true

          echo
          echo "=============================================================="
