name: "🎮 Playit + Counter-Strike 1.6 Vanilla"

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # 🎮 SERVER IDENTITY
      # ============================================================

      hostname:
        name: "🏷️ Server Hostname"
        description: "نامی که بازیکنان در Server Browser می‌بینند."
        required: true
        default: "🎮 CS 1.6 Vanilla | Playit"
        type: string

      start_map:
        name: "🗺️ Start Map"
        description: "نام map اولیه. مثال: de_dust2"
        required: true
        default: "de_dust2"
        type: string

      maxplayers:
        name: "👥 Max Players"
        description: "حداکثر تعداد بازیکنان."
        required: true
        default: "16"
        type: number

      # ============================================================
      # ⚙️ ROUND / GAMEPLAY
      # ============================================================

      roundtime:
        name: "⏱️ Round Time"
        description: "زمان هر Round بر حسب دقیقه."
        required: true
        default: "5"
        type: number

      freezetime:
        name: "❄️ Freeze Time"
        description: "زمان Freeze ابتدای Round بر حسب ثانیه."
        required: true
        default: "3"
        type: number

      buytime:
        name: "💰 Buy Time"
        description: "زمان خرید بر حسب دقیقه."
        required: true
        default: "0.25"
        type: number

      startmoney:
        name: "💵 Start Money"
        description: "پول اولیه بازیکنان."
        required: true
        default: "800"
        type: number

      friendlyfire:
        name: "🔫 Friendly Fire"
        description: "آیا آسیب به هم‌تیمی‌ها فعال باشد؟"
        required: true
        default: false
        type: boolean

      footsteps:
        name: "👣 Footsteps"
        description: "فعال بودن صدای قدم‌ها."
        required: true
        default: true
        type: boolean

      limitteams:
        name: "⚖️ Team Limit"
        description: "حداکثر اختلاف تعداد بازیکنان دو تیم."
        required: true
        default: "2"
        type: number

      autoteambalance:
        name: "⚖️ Auto Team Balance"
        description: "متعادل‌سازی خودکار تیم‌ها."
        required: true
        default: true
        type: boolean

      tkpunish:
        name: "☠️ Team Kill Punishment"
        description: "مجازات Team Kill."
        required: true
        default: false
        type: boolean

      c4timer:
        name: "💣 C4 Timer"
        description: "زمان انفجار C4 بر حسب ثانیه."
        required: true
        default: "35"
        type: number

      forcechasecam:
        name: "👁️ Force Chase Camera"
        description: "محدودیت Spectator Camera."
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"

      # ============================================================
      # 🎙️ VOICE
      # ============================================================

      voiceenable:
        name: "🎙️ Voice Chat"
        description: "فعال بودن Voice Chat."
        required: true
        default: true
        type: boolean

      alltalk:
        name: "📢 All Talk"
        description: "آیا بازیکنان زنده و مرده بتوانند با همه صحبت کنند؟"
        required: true
        default: false
        type: boolean

      # ============================================================
      # 🌐 NETWORK
      # ============================================================

      maxrate:
        name: "📡 sv_maxrate"
        description: "حداکثر network rate."
        required: true
        default: "25000"
        type: number

      minrate:
        name: "📡 sv_minrate"
        description: "حداقل network rate."
        required: true
        default: "2500"
        type: number

      maxupdaterate:
        name: "📡 sv_maxupdaterate"
        description: "حداکثر update rate."
        required: true
        default: "101"
        type: number

      minupdaterate:
        name: "📡 sv_minupdaterate"
        description: "حداقل update rate."
        required: true
        default: "20"
        type: number

      unlag:
        name: "🛰️ sv_unlag"
        description: "فعال بودن lag compensation."
        required: true
        default: true
        type: boolean

      maxunlag:
        name: "🛰️ sv_maxunlag"
        description: "حداکثر زمان lag compensation."
        required: true
        default: "0.5"
        type: number

      systicrate:
        name: "⚙️ sys_ticrate"
        description: "Tick rate سرور HLDS."
        required: true
        default: "1000"
        type: number

      # ============================================================
      # 📜 LOGGING
      # ============================================================

      logdetail:
        name: "📜 mp_logdetail"
        description: "سطح جزئیات log مربوط به بازیکنان."
        required: true
        default: "3"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"

      # ============================================================
      # 🧩 ADVANCED
      # ============================================================

      extra_cvars:
        name: "🧩 Extra Vanilla HLDS CVars"
        description: "هر CVar اضافی را یک خط وارد کنید. مثال: mp_timelimit 30"
        required: false
        default: ""
        type: string


jobs:

  playit_cs16:

    name: "🎮 Playit + CS 1.6 Vanilla"

    runs-on: ubuntu-latest

    # GitHub-hosted runner hard limit.
    timeout-minutes: 360

    permissions:
      contents: read

    env:

      # ============================================================
      # 🔒 FIXED NETWORK CONFIGURATION
      # ============================================================

      # Playit Tunnel:
      # UDP
      # Origin: 127.0.0.1:27015

      CS_IP: "127.0.0.1"
      CS_PORT: "27015"

      # Playit tunnel is expected to point to:
      # UDP 127.0.0.1:27015

      # ============================================================
      # 📂 PATHS
      # ============================================================

      CS_INSTALL_DIR: "/opt/cs16"

      # ============================================================
      # ⏱️ RUNTIME
      # ============================================================

      MAX_RUNTIME_MINUTES: "340"
      MONITOR_INTERVAL_SECONDS: "30"

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: "1️⃣ 🖥️ System Information"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🖥️ SYSTEM INFORMATION"
          echo "=============================================================="
          echo

          echo "📅 UTC:"
          date -u

          echo
          echo "🐧 OS:"
          cat /etc/os-release

          echo
          echo "🧠 Kernel:"
          uname -a

          echo
          echo "🏗️ Architecture:"
          uname -m

          echo
          echo "⚙️ CPU:"
          lscpu | sed -n '1,35p' || true

          echo
          echo "🧠 MEMORY:"
          free -h

          echo
          echo "💾 FILESYSTEM:"
          df -h

          echo
          echo "🌐 NETWORK:"
          ip -br addr || true

          echo
          echo "🛣️ ROUTING:"
          ip route || true

          echo
          echo "🔌 DNS:"
          cat /etc/resolv.conf || true

          echo
          echo "=============================================================="
          echo "✅ SYSTEM INFORMATION COMPLETE"
          echo "=============================================================="

      # ============================================================
      # 2. VALIDATE USER INPUTS
      # ============================================================

      - name: "2️⃣ 🔎 Validate Server Configuration"
        shell: bash
        env:
          INPUT_HOSTNAME: ${{ inputs.hostname }}
          INPUT_MAP: ${{ inputs.start_map }}
          INPUT_MAXPLAYERS: ${{ inputs.maxplayers }}
          INPUT_ROUNDTIME: ${{ inputs.roundtime }}
          INPUT_FREEZETIME: ${{ inputs.freezetime }}
          INPUT_BUYTIME: ${{ inputs.buytime }}
          INPUT_STARTMONEY: ${{ inputs.startmoney }}
          INPUT_LIMITTEAMS: ${{ inputs.limitteams }}
          INPUT_C4TIMER: ${{ inputs.c4timer }}
          INPUT_MAXRATE: ${{ inputs.maxrate }}
          INPUT_MINRATE: ${{ inputs.minrate }}
          INPUT_MAXUPDATERATE: ${{ inputs.maxupdaterate }}
          INPUT_MINUPDATERATE: ${{ inputs.minupdaterate }}
          INPUT_MAXUNLAG: ${{ inputs.maxunlag }}
          INPUT_SYSTICRATE: ${{ inputs.systicrate }}
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🔎 VALIDATING USER CONFIGURATION"
          echo "=============================================================="
          echo

          if [ -z "$INPUT_HOSTNAME" ]; then
            echo "❌ Hostname is empty."
            exit 1
          fi

          if [ -z "$INPUT_MAP" ]; then
            echo "❌ Start map is empty."
            exit 1
          fi

          if ! [[ "$INPUT_MAXPLAYERS" =~ ^[0-9]+$ ]]; then
            echo "❌ Max players must be an integer."
            exit 1
          fi

          if [ "$INPUT_MAXPLAYERS" -lt 1 ] || [ "$INPUT_MAXPLAYERS" -gt 32 ]; then
            echo "❌ Max players must be between 1 and 32."
            exit 1
          fi

          if ! [[ "$INPUT_ROUNDTIME" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ Round time is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_FREEZETIME" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ Freeze time is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_BUYTIME" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ Buy time is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_STARTMONEY" =~ ^[0-9]+$ ]]; then
            echo "❌ Start money is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_LIMITTEAMS" =~ ^[0-9]+$ ]]; then
            echo "❌ Team limit is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_C4TIMER" =~ ^[0-9]+$ ]]; then
            echo "❌ C4 timer is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_MAXRATE" =~ ^[0-9]+$ ]]; then
            echo "❌ sv_maxrate is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_MINRATE" =~ ^[0-9]+$ ]]; then
            echo "❌ sv_minrate is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_MAXUPDATERATE" =~ ^[0-9]+$ ]]; then
            echo "❌ sv_maxupdaterate is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_MINUPDATERATE" =~ ^[0-9]+$ ]]; then
            echo "❌ sv_minupdaterate is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_MAXUNLAG" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "❌ sv_maxunlag is invalid."
            exit 1
          fi

          if ! [[ "$INPUT_SYSTICRATE" =~ ^[0-9]+$ ]]; then
            echo "❌ sys_ticrate is invalid."
            exit 1
          fi

          if [ "$INPUT_MAXRATE" -lt "$INPUT_MINRATE" ]; then
            echo "❌ sv_maxrate cannot be lower than sv_minrate."
            exit 1
          fi

          if [ "$INPUT_MAXUPDATERATE" -lt "$INPUT_MINUPDATERATE" ]; then
            echo "❌ sv_maxupdaterate cannot be lower than sv_minupdaterate."
            exit 1
          fi

          echo "✅ Configuration validation passed."

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: "3️⃣ 📦 Install Dependencies"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "📦 INSTALLING DEPENDENCIES"
          echo "=============================================================="
          echo

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            gnupg \
            jq \
            iproute2 \
            net-tools \
            dnsutils \
            procps \
            lsof \
            unzip \
            tar \
            wget \
            lib32gcc-s1 \
            lib32stdc++6 \
            libc6-i386 \
            tmux \
            steamcmd

          echo
          echo "🔎 Verifying tools..."

          for command in \
            curl \
            wget \
            gpg \
            jq \
            ip \
            ss \
            dig \
            free \
            lsof \
            tmux \
            steamcmd
          do
            if command -v "$command" >/dev/null 2>&1; then
              echo "   ✅ $command -> $(command -v "$command")"
            else
              echo "   ❌ Missing: $command"
              exit 1
            fi
          done

          echo
          echo "✅ Dependencies ready."

      # ============================================================
      # 4. CONFIGURE OFFICIAL PLAYIT REPOSITORY
      # ============================================================

      - name: "4️⃣ 🎮 Configure Playit Repository"
        shell: bash
        run: |
          set -Eeuo pipefail

          PLAYIT_KEYRING="/etc/apt/trusted.gpg.d/playit.gpg"
          PLAYIT_SOURCE="/etc/apt/sources.list.d/playit-cloud.list"

          echo
          echo "=============================================================="
          echo "🎮 PLAYIT REPOSITORY"
          echo "=============================================================="
          echo

          curl -SsL \
            https://playit-cloud.github.io/ppa/key.gpg |
            gpg --dearmor |
            sudo tee "$PLAYIT_KEYRING" >/dev/null

          echo \
            "deb [signed-by=$PLAYIT_KEYRING] https://playit-cloud.github.io/ppa/data ./" |
            sudo tee "$PLAYIT_SOURCE" >/dev/null

          sudo apt-get update

          echo
          echo "🔎 Playit package:"
          apt-cache policy playit || true

          echo
          echo "✅ Playit repository configured."

      # ============================================================
      # 5. INSTALL PLAYIT
      # ============================================================

      - name: "5️⃣ 📥 Install Playit Agent"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "📥 INSTALLING PLAYIT"
          echo "=============================================================="
          echo

          sudo apt-get install -y playit

          echo
          echo "🎮 Playit executable:"
          command -v playit || true

          echo
          echo "🎮 Playit version:"
          playit version || true

          echo
          echo "📦 Package:"
          dpkg -s playit |
            sed \
              -n \
              -e '/^Package:/p' \
              -e '/^Version:/p' \
              -e '/^Architecture:/p' \
              -e '/^Status:/p'

          echo
          echo "=============================================================="
          echo "✅ PLAYIT INSTALLED"
          echo "=============================================================="

      # ============================================================
      # 6. VALIDATE PLAYIT SECRET
      # ============================================================

      - name: "6️⃣ 🔐 Validate Playit Secret"
        shell: bash
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🔐 PLAYIT SECRET VALIDATION"
          echo "=============================================================="
          echo

          if [ -z "${PLAYIT_SECRET_KEY:-}" ]; then
            echo "❌ PLAYIT_SECRET_KEY is missing."
            echo
            echo "Create this repository secret before running the workflow."
            exit 1
          fi

          echo "🔐 Secret detected."
          echo "   Value: [REDACTED]"

          echo
          echo "✅ Secret validation passed."

      # ============================================================
      # 7. CONFIGURE PLAYIT SECRET
      # ============================================================

      - name: "7️⃣ 🔐 Configure Playit Agent"
        shell: bash
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077

          PLAYIT_CONFIG_DIR="/etc/playit"
          PLAYIT_SECRET_FILE="/etc/playit/playit.toml"

          echo
          echo "=============================================================="
          echo "🔐 PLAYIT AUTHENTICATION"
          echo "=============================================================="
          echo

          sudo install \
            -d \
            -m 0750 \
            "$PLAYIT_CONFIG_DIR"

          TMP_SECRET="$(mktemp)"

          trap 'rm -f "$TMP_SECRET"' EXIT

          printf 'secret_key = "%s"\n' \
            "$PLAYIT_SECRET_KEY" \
            > "$TMP_SECRET"

          chmod 600 "$TMP_SECRET"

          sudo install \
            -o playit \
            -g playit \
            -m 0600 \
            "$TMP_SECRET" \
            "$PLAYIT_SECRET_FILE"

          rm -f "$TMP_SECRET"

          echo "🔎 Secret file:"
          sudo stat \
            -c '   Path        : %n
             Owner       : %U:%G
             Permissions : %a
             Size        : %s bytes' \
            "$PLAYIT_SECRET_FILE"

          echo
          echo "🔎 Syntax:"
          sudo grep -Eq '^secret_key = ".+"' \
            "$PLAYIT_SECRET_FILE"

          echo "   ✅ secret_key entry detected."
          echo "   🔐 Value: [REDACTED]"

      # ============================================================
      # 8. PLAYIT SERVICE PREFLIGHT
      # ============================================================

      - name: "8️⃣ ⚙️ Verify Playit Service"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "⚙️ PLAYIT SYSTEMD SERVICE"
          echo "=============================================================="
          echo

          sudo systemctl daemon-reload

          echo "📄 Service:"
          sudo systemctl cat playit || true

          echo
          echo "📁 Secret:"
          sudo ls -la /etc/playit/

          echo
          echo "✅ Playit service configuration inspected."

      # ============================================================
      # 9. NETWORK PREFLIGHT
      # ============================================================

      - name: "9️⃣ 🌐 Network Pre-Flight"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🌐 NETWORK PRE-FLIGHT"
          echo "=============================================================="
          echo

          echo "🌍 Public IPv4:"
          curl \
            -4 \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            https://api.ipify.org \
            || true

          echo
          echo

          echo "🔐 Playit API:"
          curl \
            -I \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            https://api.playit.gg \
            || true

          echo
          echo

          echo "🧭 DNS:"
          getent hosts api.playit.gg || true

          echo
          echo "=============================================================="
          echo "✅ NETWORK PREFLIGHT COMPLETE"
          echo "=============================================================="

      # ============================================================
      # 10. START PLAYIT
      # ============================================================

      - name: "🔟 🚀 Start Playit Agent"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🚀 STARTING PLAYIT"
          echo "=============================================================="
          echo

          sudo systemctl enable playit
          sudo systemctl restart playit

          sleep 5

          echo
          echo "📊 Service status:"
          sudo systemctl status playit \
            --no-pager \
            --full \
            || true

          echo
          echo "📜 Recent journal:"
          sudo journalctl \
            -u playit \
            --no-pager \
            -n 100 \
            -o short-iso \
            || true

      # ============================================================
      # 11. VERIFY PLAYIT
      # ============================================================

      - name: "1️⃣1️⃣ 🔎 Verify Playit"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🔎 VERIFYING PLAYIT"
          echo "=============================================================="
          echo

          if sudo systemctl is-active --quiet playit; then
            echo "🟢 Playit service is ACTIVE."
          else
            echo "🔴 Playit service is NOT ACTIVE."

            sudo journalctl \
              -u playit \
              --no-pager \
              -n 200 \
              -o short-iso \
              || true

            exit 1
          fi

          echo
          echo "🧩 Playit process:"
          ps aux | grep -Ei '[p]layit|[p]layitd' || true

          echo
          echo "🔌 Network sockets:"
          sudo ss -lntup || true

          echo
          echo "📜 Playit log:"
          sudo journalctl \
            -u playit \
            --no-pager \
            -n 100 \
            -o short-iso \
            || true

          echo
          echo "✅ Playit agent is active."

      # ============================================================
      # 12. INSTALL HLDS / CS 1.6
      # ============================================================

      - name: "1️⃣2️⃣ 📥 Install Vanilla CS 1.6 HLDS"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "📥 INSTALLING VANILLA CS 1.6 HLDS"
          echo "=============================================================="
          echo

          echo "📂 Installation directory:"
          echo "   $CS_INSTALL_DIR"

          sudo mkdir -p "$CS_INSTALL_DIR"

          sudo chown \
            "$USER:$USER" \
            "$CS_INSTALL_DIR"

          cd "$CS_INSTALL_DIR"

          echo
          echo "⬇️ Running SteamCMD..."

          steamcmd \
            +force_install_dir "$CS_INSTALL_DIR" \
            +login anonymous \
            +app_set_config 90 mod cstrike \
            +app_update 90 validate \
            +quit

          echo
          echo "🔎 Installation verification..."

          if [ ! -f "$CS_INSTALL_DIR/hlds_run" ]; then
            echo "❌ hlds_run not found."
            exit 1
          fi

          if [ ! -d "$CS_INSTALL_DIR/cstrike" ]; then
            echo "❌ cstrike directory not found."
            exit 1
          fi

          chmod +x "$CS_INSTALL_DIR/hlds_run" || true

          echo "   ✅ hlds_run"
          echo "   ✅ cstrike/"
          echo

          echo "📂 HLDS root:"
          find "$CS_INSTALL_DIR" \
            -maxdepth 2 \
            -type f |
            sort |
            head -n 150

          echo
          echo "=============================================================="
          echo "✅ VANILLA CS 1.6 INSTALLED"
          echo "=============================================================="

      # ============================================================
      # 13. BUILD SERVER CONFIG
      # ============================================================

      - name: "1️⃣3️⃣ ⚙️ Configure Vanilla CS 1.6"
        shell: bash
        env:
          CS_HOSTNAME: ${{ inputs.hostname }}
          CS_START_MAP: ${{ inputs.start_map }}
          CS_MAXPLAYERS: ${{ inputs.maxplayers }}

          CS_MP_ROUNDTIME: ${{ inputs.roundtime }}
          CS_MP_FREEZETIME: ${{ inputs.freezetime }}
          CS_MP_BUYTIME: ${{ inputs.buytime }}
          CS_MP_STARTMONEY: ${{ inputs.startmoney }}

          CS_MP_FRIENDLYFIRE: ${{ inputs.friendlyfire }}
          CS_MP_FOOTSTEPS: ${{ inputs.footsteps }}
          CS_MP_LIMITTEAMS: ${{ inputs.limitteams }}
          CS_MP_AUTOTEAMBALANCE: ${{ inputs.autoteambalance }}
          CS_MP_TKPUNISH: ${{ inputs.tkpunish }}
          CS_MP_C4TIMER: ${{ inputs.c4timer }}

          CS_FORCECHASecam: ${{ inputs.forcechasecam }}

          CS_VOICEENABLE: ${{ inputs.voiceenable }}
          CS_ALLTALK: ${{ inputs.alltalk }}

          CS_SV_MAXRATE: ${{ inputs.maxrate }}
          CS_SV_MINRATE: ${{ inputs.minrate }}
          CS_SV_MAXUPDATERATE: ${{ inputs.maxupdaterate }}
          CS_SV_MINUPDATERATE: ${{ inputs.minupdaterate }}
          CS_SV_UNLAG: ${{ inputs.unlag }}
          CS_SV_MAXUNLAG: ${{ inputs.maxunlag }}

          CS_SYS_TICRATE: ${{ inputs.systicrate }}

          CS_MP_LOGDETAIL: ${{ inputs.logdetail }}
          CS_EXTRA_CVARS: ${{ inputs.extra_cvars }}

        run: |
          set -Eeuo pipefail

          SERVER_CFG="$CS_INSTALL_DIR/cstrike/server.cfg"

          echo
          echo "=============================================================="
          echo "⚙️ BUILDING SERVER CONFIGURATION"
          echo "=============================================================="
          echo

          bool_to_int() {
            case "$1" in
              true|TRUE|True)
                echo "1"
                ;;
              false|FALSE|False)
                echo "0"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          FF="$(bool_to_int "$CS_MP_FRIENDLYFIRE")"
          FOOTSTEPS="$(bool_to_int "$CS_MP_FOOTSTEPS")"
          AUTOTEAM="$(bool_to_int "$CS_MP_AUTOTEAMBALANCE")"
          TKPUNISH="$(bool_to_int "$CS_MP_TKPUNISH")"
          VOICE="$(bool_to_int "$CS_VOICEENABLE")"
          ALLTALK_VALUE="$(bool_to_int "$CS_ALLTALK")"
          UNLAG="$(bool_to_int "$CS_SV_UNLAG")"

          cat > "$SERVER_CFG" <<EOF
          // ============================================================
          // Counter-Strike 1.6 Vanilla HLDS
          // Generated by GitHub Actions
          // ============================================================

          hostname "$CS_HOSTNAME"

          // ------------------------------------------------------------
          // NETWORK
          // ------------------------------------------------------------

          sv_lan "0"

          // Playit Origin:
          // UDP 127.0.0.1:27015

          sv_maxrate "$CS_SV_MAXRATE"
          sv_minrate "$CS_SV_MINRATE"

          sv_maxupdaterate "$CS_SV_MAXUPDATERATE"
          sv_minupdaterate "$CS_SV_MINUPDATERATE"

          sv_unlag "$UNLAG"
          sv_maxunlag "$CS_SV_MAXUNLAG"

          sys_ticrate "$CS_SYS_TICRATE"

          // ------------------------------------------------------------
          // GAMEPLAY
          // ------------------------------------------------------------

          mp_roundtime "$CS_MP_ROUNDTIME"
          mp_freezetime "$CS_MP_FREEZETIME"
          mp_buytime "$CS_MP_BUYTIME"
          mp_startmoney "$CS_MP_STARTMONEY"

          mp_friendlyfire "$FF"
          mp_footsteps "$FOOTSTEPS"

          mp_limitteams "$CS_MP_LIMITTEAMS"
          mp_autoteambalance "$AUTOTEAM"

          mp_tkpunish "$TKPUNISH"
          mp_c4timer "$CS_MP_C4TIMER"

          // ------------------------------------------------------------
          // SPECTATOR
          // ------------------------------------------------------------

          mp_forcechasecam "$CS_FORCECHASecam"

          // ------------------------------------------------------------
          // VOICE
          // ------------------------------------------------------------

          voice_enable "$VOICE"
          sv_alltalk "$ALLTALK_VALUE"

          // ------------------------------------------------------------
          // SERVER
          // ------------------------------------------------------------

          pausable "0"

          log "on"
          mp_logdetail "$CS_MP_LOGDETAIL"

          decalfrequency "60"

          sv_allowupload "1"
          sv_allowdownload "1"

          sv_send_logos "1"
          sv_send_resources "1"

          // ------------------------------------------------------------
          // MISC
          // ------------------------------------------------------------

          sv_contact ""
          sv_region "255"

          // ============================================================
          // END OF BASE CONFIG
          // ============================================================
          EOF

          # ------------------------------------------------------------
          # Extra user CVars
          # ------------------------------------------------------------

          if [ -n "${CS_EXTRA_CVARS:-}" ]; then

            echo >> "$SERVER_CFG"
            echo "// ============================================================" >> "$SERVER_CFG"
            echo "// USER EXTRA CVARS" >> "$SERVER_CFG"
            echo "// ============================================================" >> "$SERVER_CFG"

            printf '%s\n' "$CS_EXTRA_CVARS" |
              sed '/^[[:space:]]*$/d' |
              while IFS= read -r line; do
                printf '%s\n' "$line" >> "$SERVER_CFG"
              done

          fi

          chmod 0644 "$SERVER_CFG"

          echo
          echo "📄 Generated server.cfg:"
          echo "──────────────────────────────────────────────────────────────"

          cat "$SERVER_CFG"

          echo
          echo "=============================================================="
          echo "✅ SERVER CONFIGURATION COMPLETE"
          echo "=============================================================="

      # ============================================================
      # 14. VALIDATE CS ORIGIN PORT
      # ============================================================

      - name: "1️⃣4️⃣ 🔌 Validate CS Origin"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🔌 CS ORIGIN VALIDATION"
          echo "=============================================================="
          echo

          echo "Protocol : UDP"
          echo "Address  : $CS_IP"
          echo "Port     : $CS_PORT"
          echo
          echo "Playit tunnel must point to:"
          echo "   UDP $CS_IP:$CS_PORT"
          echo

          if sudo ss -lun |
            awk '{print $5}' |
            grep -Eq "(^|:)${CS_PORT}$"; then

            echo "❌ UDP port $CS_PORT is already occupied."
            sudo ss -lunp || true
            exit 1
          fi

          echo "✅ UDP $CS_PORT is available."

      # ============================================================
      # 15. START HLDS
      # ============================================================

      - name: "1️⃣5️⃣ 🚀 Start Vanilla CS 1.6"
        shell: bash
        env:
          CS_START_MAP: ${{ inputs.start_map }}
          CS_MAXPLAYERS: ${{ inputs.maxplayers }}
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🚀 STARTING VANILLA CS 1.6"
          echo "=============================================================="
          echo

          cd "$CS_INSTALL_DIR"

          LOG_FILE="$CS_INSTALL_DIR/hlds-console.log"
          PID_FILE="$CS_INSTALL_DIR/hlds.pid"

          : > "$LOG_FILE"

          echo "🎮 Game        : Counter-Strike 1.6"
          echo "🗺️ Map         : $CS_START_MAP"
          echo "👥 Max Players : $CS_MAXPLAYERS"
          echo "🌐 Bind        : $CS_IP:$CS_PORT"
          echo

          # HLDS is intentionally bound to localhost.
          # Playit forwards external UDP traffic to this origin.

          nohup ./hlds_run \
            -game cstrike \
            -console \
            -norestart \
            -ip "$CS_IP" \
            -port "$CS_PORT" \
            +maxplayers "$CS_MAXPLAYERS" \
            +map "$CS_START_MAP" \
            +sv_lan "0" \
            > "$LOG_FILE" 2>&1 &

          HLDS_PID=$!

          echo "$HLDS_PID" > "$PID_FILE"

          echo "🧩 HLDS launcher PID:"
          echo "   $HLDS_PID"

          echo
          echo "⏳ Waiting for UDP listener..."

          READY=0

          for i in $(seq 1 45); do

            if sudo ss -lun |
              awk '{print $5}' |
              grep -Eq "(^|:)${CS_PORT}$"; then

              READY=1
              echo "   🟢 UDP $CS_PORT is listening."
              break
            fi

            if ! kill -0 "$HLDS_PID" 2>/dev/null; then
              echo "   🔴 HLDS launcher exited."
              break
            fi

            echo "   ⏳ Waiting... ${i}/45"
            sleep 1

          done

          if [ "$READY" -ne 1 ]; then

            echo
            echo "❌ HLDS failed to open UDP $CS_PORT."

            echo
            echo "📜 HLDS log:"
            tail -n 250 "$LOG_FILE" || true

            echo
            echo "🔌 UDP sockets:"
            sudo ss -lunp || true

            exit 1
          fi

          echo
          echo "🧩 HLDS processes:"
          ps aux | grep -E '[h]lds|[s]team' || true

          echo
          echo "🔌 Listening socket:"
          sudo ss -lunp |
            grep -E ":${CS_PORT}([[:space:]]|$)" ||
            true

          echo
          echo "=============================================================="
          echo "🟢 VANILLA CS 1.6 IS RUNNING"
          echo "=============================================================="

      # ============================================================
      # 16. VERIFY SERVER
      # ============================================================

      - name: "1️⃣6️⃣ 🔎 Verify Playit + CS"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "=============================================================="
          echo "🔎 FULL SERVER VERIFICATION"
          echo "=============================================================="
          echo

          echo "🎮 PLAYIT:"
          if sudo systemctl is-active --quiet playit; then
            echo "   🟢 ACTIVE"
          else
            echo "   🔴 INACTIVE"
            exit 1
          fi

          echo
          echo "🎮 HLDS:"
          if [ -f "$CS_INSTALL_DIR/hlds.pid" ]; then

            HLDS_PID="$(cat "$CS_INSTALL_DIR/hlds.pid")"

            if kill -0 "$HLDS_PID" 2>/dev/null; then
              echo "   🟢 PID $HLDS_PID is alive."
            else
              echo "   🔴 PID $HLDS_PID is not alive."
              exit 1
            fi

          else
            echo "   🔴 PID file missing."
            exit 1
          fi

          echo
          echo "🔌 UDP:"
          if sudo ss -lun |
            awk '{print $5}' |
            grep -Eq "(^|:)${CS_PORT}$"; then

            echo "   🟢 UDP $CS_PORT LISTENING"

          else

            echo "   🔴 UDP $CS_PORT NOT LISTENING"
            exit 1

          fi

          echo
          echo "📜 HLDS log:"
          tail -n 100 \
            "$CS_INSTALL_DIR/hlds-console.log" ||
            true

          echo
          echo "📜 Playit journal:"
          sudo journalctl \
            -u playit \
            --no-pager \
            -n 100 \
            -o short-iso ||
            true

          echo
          echo "=============================================================="
          echo "🟢 PLAYIT + CS 1.6 ARE RUNNING"
          echo "=============================================================="

      # ============================================================
      # 17. RUNTIME MONITOR
      # ============================================================

      - name: "1️⃣7️⃣ ⏱️ Runtime Monitor"
        shell: bash
        run: |
          set -Eeuo pipefail

          MAX_RUNTIME_SECONDS=$((MAX_RUNTIME_MINUTES * 60))
          CHECK_INTERVAL="$MONITOR_INTERVAL_SECONDS"

          START_EPOCH="$(date +%s)"

          CS_PID_FILE="$CS_INSTALL_DIR/hlds.pid"
          CS_LOG_FILE="$CS_INSTALL_DIR/hlds-console.log"

          echo
          echo "=============================================================="
          echo "⏱️ RUNTIME MONITOR"
          echo "=============================================================="
          echo

          echo "🎮 Counter-Strike:"
          echo "   Origin      : UDP $CS_IP:$CS_PORT"
          echo "   Map         : ${{ inputs.start_map }}"
          echo "   Max Players : ${{ inputs.maxplayers }}"
          echo

          echo "🎮 Playit:"
          echo "   Origin      : UDP $CS_IP:$CS_PORT"
          echo

          echo "⏱️ Runtime:"
          echo "   GitHub limit : 360 minutes"
          echo "   Server       : $MAX_RUNTIME_MINUTES minutes"
          echo "   Safety       : $((360 - MAX_RUNTIME_MINUTES)) minutes"
          echo

          cleanup() {

            set +e

            echo
            echo "=============================================================="
            echo "🧹 CLEANUP"
            echo "=============================================================="
            echo

            # --------------------------------------------------------
            # Stop HLDS
            # --------------------------------------------------------

            echo "🛑 Stopping HLDS..."

            if [ -f "$CS_PID_FILE" ]; then

              HLDS_PID="$(cat "$CS_PID_FILE" 2>/dev/null || true)"

              if [ -n "${HLDS_PID:-}" ] &&
                 kill -0 "$HLDS_PID" 2>/dev/null; then

                echo "   Sending TERM to PID $HLDS_PID..."
                kill -TERM "$HLDS_PID" 2>/dev/null || true

                for _ in $(seq 1 10); do

                  if ! kill -0 "$HLDS_PID" 2>/dev/null; then
                    break
                  fi

                  sleep 1

                done

                if kill -0 "$HLDS_PID" 2>/dev/null; then
                  echo "   Sending KILL to PID $HLDS_PID..."
                  kill -KILL "$HLDS_PID" 2>/dev/null || true
                fi

              fi

            fi

            # --------------------------------------------------------
            # Fallback only for the exact HLDS installation path.
            # --------------------------------------------------------

            pkill -TERM -f \
              "$CS_INSTALL_DIR/hlds_linux" \
              2>/dev/null ||
              true

            sleep 2

            pkill -KILL -f \
              "$CS_INSTALL_DIR/hlds_linux" \
              2>/dev/null ||
              true

            # --------------------------------------------------------
            # Stop Playit
            # --------------------------------------------------------

            echo
            echo "🛑 Stopping Playit..."

            sudo systemctl stop playit \
              2>/dev/null ||
              true

            # --------------------------------------------------------
            # Final diagnostics
            # --------------------------------------------------------

            echo
            echo "📊 Final Playit state:"
            sudo systemctl status playit \
              --no-pager \
              --full \
              2>&1 ||
              true

            echo
            echo "🔌 Final UDP sockets:"
            sudo ss -lunp ||
              true

            echo
            echo "🎮 Final HLDS processes:"
            ps aux | grep -E '[h]lds|[s]team' ||
              true

            echo
            echo "📜 Final HLDS log:"
            tail -n 250 "$CS_LOG_FILE" \
              2>/dev/null ||
              true

            echo
            echo "📜 Final Playit log:"
            sudo journalctl \
              -u playit \
              --no-pager \
              -n 250 \
              -o short-iso \
              2>/dev/null ||
              true

            echo
            echo "=============================================================="
            echo "🧹 CLEANUP COMPLETE"
            echo "=============================================================="
          }

          trap cleanup EXIT INT TERM

          while true; do

            NOW_EPOCH="$(date +%s)"
            ELAPSED="$((NOW_EPOCH - START_EPOCH))"
            REMAINING="$((MAX_RUNTIME_SECONDS - ELAPSED))"

            ELAPSED_MINUTES="$((ELAPSED / 60))"
            ELAPSED_SECONDS="$((ELAPSED % 60))"

            echo
            echo "──────────────────────────────────────────────────────────────"

            printf \
              '⏱️ Runtime: %02d:%02d\n' \
              "$ELAPSED_MINUTES" \
              "$ELAPSED_SECONDS"

            if [ "$REMAINING" -gt 0 ]; then

              REMAINING_MINUTES="$((REMAINING / 60))"
              REMAINING_SECONDS="$((REMAINING % 60))"

              printf \
                '   ⏳ Until shutdown: %02d:%02d\n' \
                "$REMAINING_MINUTES" \
                "$REMAINING_SECONDS"

            fi

            # --------------------------------------------------------
            # Playit health
            # --------------------------------------------------------

            echo
            echo "🎮 Playit:"

            if sudo systemctl is-active --quiet playit; then

              echo "   🟢 ACTIVE"

            else

              echo "   🔴 INACTIVE"

              sudo journalctl \
                -u playit \
                --no-pager \
                -n 150 \
                -o short-iso \
                || true

              exit 1

            fi

            # --------------------------------------------------------
            # HLDS process health
            # --------------------------------------------------------

            echo
            echo "🎮 Counter-Strike:"

            if [ ! -f "$CS_PID_FILE" ]; then

              echo "   🔴 HLDS PID file missing."
              exit 1

            fi

            HLDS_PID="$(cat "$CS_PID_FILE" 2>/dev/null || true)"

            if [ -z "${HLDS_PID:-}" ]; then

              echo "   🔴 HLDS PID is empty."
              exit 1

            fi

            if kill -0 "$HLDS_PID" 2>/dev/null; then

              echo "   🟢 HLDS PID $HLDS_PID is alive."

            else

              echo "   🔴 HLDS PID $HLDS_PID is dead."

              echo
              echo "📜 HLDS log:"
              tail -n 250 "$CS_LOG_FILE" ||
                true

              exit 1

            fi

            # --------------------------------------------------------
            # UDP port health
            # --------------------------------------------------------

            echo
            echo "🔌 UDP Origin:"

            if sudo ss -lun |
              awk '{print $5}' |
              grep -Eq "(^|:)${CS_PORT}$"; then

              echo "   🟢 UDP $CS_IP:$CS_PORT LISTENING"

            else

              echo "   🔴 UDP $CS_IP:$CS_PORT NOT LISTENING"

              echo
              echo "📜 HLDS log:"
              tail -n 250 "$CS_LOG_FILE" ||
                true

              exit 1

            fi

            # --------------------------------------------------------
            # Periodic diagnostics
            # --------------------------------------------------------

            echo
            echo "🧩 Processes:"
            ps aux | grep -E '[h]lds|[s]team' ||
              true

            echo
            echo "🔌 UDP sockets:"
            sudo ss -lunp ||
              true

            # --------------------------------------------------------
            # Planned shutdown
            # --------------------------------------------------------

            if [ "$ELAPSED" -ge "$MAX_RUNTIME_SECONDS" ]; then

              echo
              echo "=============================================================="
              echo "🛑 PLANNED SERVER SHUTDOWN"
              echo "=============================================================="
              echo

              echo "⏱️ Runtime threshold reached."
              echo "🧹 Graceful cleanup will begin."

              exit 0

            fi

            sleep "$CHECK_INTERVAL"

          done

      # ============================================================
      # 18. FAILURE DIAGNOSTICS
      # ============================================================

      - name: "1️⃣8️⃣ 🧪 Failure Diagnostics"
        if: failure()
        shell: bash
        run: |
          set +e

          echo
          echo "=============================================================="
          echo "🧪 FINAL FAILURE DIAGNOSTICS"
          echo "=============================================================="
          echo

          echo "🎮 PLAYIT STATUS:"
          sudo systemctl status playit \
            --no-pager \
            --full \
            2>&1 ||
            true

          echo
          echo "📜 PLAYIT JOURNAL:"
          sudo journalctl \
            -u playit \
            --no-pager \
            -n 500 \
            -o short-iso \
            2>&1 ||
            true

          echo
          echo "🎮 HLDS PROCESSES:"
          ps aux | grep -E '[h]lds|[s]team' ||
            true

          echo
          echo "🔌 NETWORK:"
          ip addr ||
            true

          echo
          ip route ||
            true

          echo
          sudo ss -lntup ||
            true

          echo
          echo "📜 HLDS CONSOLE:"
          tail -n 500 \
            "$CS_INSTALL_DIR/hlds-console.log" \
            2>&1 ||
            true

          echo
          echo "📄 SERVER CFG:"
          cat \
            "$CS_INSTALL_DIR/cstrike/server.cfg" \
            2>&1 ||
            true

          echo
          echo "📂 CS FILES:"
          find \
            "$CS_INSTALL_DIR/cstrike" \
            -maxdepth 2 \
            -type f \
            -printf '   %p\n' \
            2>/dev/null |
            head -n 300 ||
            true

          echo
          echo "=============================================================="
          echo "🛑 FAILURE DIAGNOSTICS COMPLETE"
          echo "=============================================================="

      # ============================================================
      # 19. SUCCESS SUMMARY
      # ============================================================

      - name: "1️⃣9️⃣ ✅ Final Summary"
        if: success()
        shell: bash
        run: |
          echo
          echo "=============================================================="
          echo "🎮 SESSION COMPLETE"
          echo "=============================================================="
          echo

          echo "🎮 PLAYIT:"
          echo "   ✅ Authenticated"
          echo "   ✅ Running"
          echo "   ✅ Monitored"

          echo
          echo "🎮 COUNTER-STRIKE 1.6:"
          echo "   ✅ Vanilla HLDS"
          echo "   ✅ Map       : ${{ inputs.start_map }}"
          echo "   ✅ MaxPlayers: ${{ inputs.maxplayers }}"
          echo "   ✅ Origin    : UDP $CS_IP:$CS_PORT"

          echo
          echo "🌐 PLAYIT TUNNEL:"
          echo "   Protocol : UDP"
          echo "   Origin   : $CS_IP:$CS_PORT"

          echo
          echo "⏱️ RUNTIME:"
          echo "   GitHub limit : 360 minutes"
          echo "   Server limit : $MAX_RUNTIME_MINUTES minutes"
          echo "   Safety       : $((360 - MAX_RUNTIME_MINUTES)) minutes"

          echo
          echo "🔐 AUTHENTICATION:"
          echo "   GitHub Secret: PLAYIT_SECRET_KEY"
          echo "   Value        : [REDACTED]"

          echo
          echo "📜 LOGS:"
          echo "   HLDS   : $CS_INSTALL_DIR/hlds-console.log"
          echo "   CS     : $CS_INSTALL_DIR/cstrike/logs/"
          echo "   Playit : systemd journal"

          echo
          echo "=============================================================="
          echo "🟢 PLAYIT + VANILLA CS 1.6 SESSION FINISHED"
          echo "=============================================================="
