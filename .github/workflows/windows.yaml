name: Windows Cloud PC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cloud-pc:
    name: Windows Cloud PC
    runs-on: windows-latest

    timeout-minutes: 360

    env:
      TS_TAG: tag:cloud-pc

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: 1. System Information
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cloudPcStartUtc = [DateTimeOffset]::UtcNow

          "CLOUD_PC_START_UTC=$($cloudPcStartUtc.ToString('o'))" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "==============================================="
          Write-Host " WINDOWS CLOUD PC"
          Write-Host "==============================================="
          Write-Host ""

          Write-Host "Cloud PC start time (UTC):"
          Write-Host "  $($cloudPcStartUtc.ToString('o'))"
          Write-Host ""

          Write-Host "Windows:"

          Get-ComputerInfo |
            Select-Object `
              WindowsProductName,
              WindowsVersion,
              OsBuildNumber,
              CsProcessors,
              CsTotalPhysicalMemory |
            Format-List

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable

          Write-Host ""
          Write-Host "Disk:"

          Get-Volume |
            Where-Object DriveLetter |
            Select-Object `
              DriveLetter,
              FileSystemLabel,
              FileSystem,
              SizeRemaining,
              Size |
            Format-Table -AutoSize


      # ============================================================
      # 2. GENERATE RDP CREDENTIALS
      # ============================================================

      - name: 2. Generate RDP Credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-RandomChar {
            param(
              [Parameter(Mandatory)]
              [string]$Characters
            )

            $index = Get-Random `
              -Minimum 0 `
              -Maximum $Characters.Length

            return $Characters[$index]
          }


          function New-RandomUsername {

            $letters = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
            $digits  = '23456789'

            $username = 'CloudPC_'

            1..10 | ForEach-Object {
              $username += Get-RandomChar -Characters $letters
            }

            $username += Get-RandomChar -Characters $digits

            return $username
          }


          function New-RandomPassword {

            $upper   = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
            $lower   = 'abcdefghijkmnopqrstuvwxyz'
            $digits  = '23456789'
            $special = '!@#$%^&*_-+=?'

            $all = $upper + $lower + $digits + $special

            $chars = @()

            $chars += Get-RandomChar -Characters $upper
            $chars += Get-RandomChar -Characters $lower
            $chars += Get-RandomChar -Characters $digits
            $chars += Get-RandomChar -Characters $special

            1..28 | ForEach-Object {
              $chars += Get-RandomChar -Characters $all
            }

            return (-join (
              $chars |
                Sort-Object { Get-Random }
            ))
          }


          $username = New-RandomUsername
          $password = New-RandomPassword


          # Mask credentials in GitHub Actions logs.
          Write-Output "::add-mask::$username"
          Write-Output "::add-mask::$password"


          "RDP_USERNAME=$username" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          Write-Host ""
          Write-Host "RDP credentials generated successfully."
          Write-Host "Credentials are masked in GitHub logs."
          Write-Host ""


      # ============================================================
      # 3. ENABLE REMOTE DESKTOP
      # ============================================================

      - name: 3. Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Enabling Remote Desktop..."


          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0


          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1


          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic


          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue


          $service = Get-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue


          if (
            $null -eq $service -or
            $service.Status -ne 'Running'
          ) {
            throw "Remote Desktop service is not running."
          }


          Write-Host "Remote Desktop enabled."


      # ============================================================
      # 4. CREATE LOCAL ADMINISTRATOR
      # ============================================================

      - name: 4. Create RDP Administrator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD


          if (-not $username -or -not $password) {
            throw "RDP credentials are missing."
          }


          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force


          # ----------------------------------------------------------
          # Create or update user.
          # ----------------------------------------------------------

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue


          if (-not $existingUser) {

            Write-Host "Creating local administrator..."

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName 'Cloud PC Administrator' `
              -Description 'Temporary Windows Cloud PC administrator' `
              -PasswordNeverExpires `
              -AccountNeverExpires |
              Out-Null

          }
          else {

            Write-Host "User already exists."

            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }


          # ----------------------------------------------------------
          # Obtain user SID.
          # ----------------------------------------------------------

          $localUser = Get-LocalUser `
            -Name $username `
            -ErrorAction Stop

          $userSid = $localUser.SID.Value


          # ----------------------------------------------------------
          # Administrators membership.
          # ----------------------------------------------------------

          $adminMember = Get-LocalGroupMember `
            -Group 'Administrators' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.SID.Value -eq $userSid
            }


          if (-not $adminMember) {

            Add-LocalGroupMember `
              -Group 'Administrators' `
              -Member $username `
              -ErrorAction Stop
          }


          # ----------------------------------------------------------
          # Remote Desktop Users membership.
          # ----------------------------------------------------------

          $rdpMember = Get-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.SID.Value -eq $userSid
            }


          if (-not $rdpMember) {

            Add-LocalGroupMember `
              -Group 'Remote Desktop Users' `
              -Member $username `
              -ErrorAction Stop
          }


          # ----------------------------------------------------------
          # Verify user.
          # ----------------------------------------------------------

          $userCheck = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue


          if (-not $userCheck) {
            throw "RDP user creation failed."
          }


          Write-Host ""
          Write-Host "RDP administrator is ready."
          Write-Host ""


      # ============================================================
      # 5. CONNECT TAILSCALE
      # ============================================================

      - name: 5. Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ env.TS_TAG }}
          version: latest


      # ============================================================
      # 6. DETECT TAILSCALE INTERFACE + IPv4
      # ============================================================

      - name: 6. Detect Tailscale Network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'


          $tailscale = Join-Path `
            $env:ProgramFiles `
            'Tailscale\tailscale.exe'


          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }


          Write-Host "Waiting for Tailscale network..."


          $tsIp = $null
          $tailscaleAdapter = $null


          for ($i = 1; $i -le 30; $i++) {

            # --------------------------------------------------------
            # Get Tailscale IPv4.
            # --------------------------------------------------------

            $result = & $tailscale ip -4 2>$null


            $candidate = $result |
              Where-Object {
                $_ -match '^100\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}$'
              } |
              Select-Object -First 1


            if ($candidate) {
              $tsIp = $candidate.Trim()
            }


            # --------------------------------------------------------
            # Find active Tailscale adapter.
            # --------------------------------------------------------

            $tailscaleAdapter = Get-NetAdapter `
              -ErrorAction SilentlyContinue |
              Where-Object {

                $_.Status -eq 'Up' -and (
                  $_.Name -match '(?i)tailscale' -or
                  $_.InterfaceDescription -match '(?i)tailscale'
                )

              } |
              Select-Object -First 1


            if ($tsIp -and $tailscaleAdapter) {
              break
            }


            Write-Host (
              "Tailscale network not ready. Attempt {0}/30..." -f $i
            )

            Start-Sleep -Seconds 2
          }


          if (-not $tailscaleAdapter) {
            throw "No active Tailscale network interface was found."
          }


          if (-not $tsIp) {
            throw "Could not obtain Tailscale IPv4 address."
          }


          if (
            $tsIp -notmatch
            '^100\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}$'
          ) {
            throw "Unexpected Tailscale IPv4 address: $tsIp"
          }


          # ----------------------------------------------------------
          # Verify that the Tailscale IPv4 exists on the detected
          # interface.
          # ----------------------------------------------------------

          $interfaceIp = Get-NetIPAddress `
            -InterfaceIndex $tailscaleAdapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq $tsIp
            }


          if (-not $interfaceIp) {
            throw `
              "Tailscale IPv4 is not assigned to the detected Tailscale interface."
          }


          $tsInterfaceAlias = $tailscaleAdapter.Name
          $tsInterfaceIndex = $tailscaleAdapter.ifIndex


          Write-Host ""
          Write-Host "Tailscale interface:"
          Write-Host "  Name        : $tsInterfaceAlias"
          Write-Host "  Index       : $tsInterfaceIndex"
          Write-Host "  Description : $($tailscaleAdapter.InterfaceDescription)"
          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host "  $tsIp"
          Write-Host ""


          "TAILSCALE_INTERFACE=$tsInterfaceAlias" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "TAILSCALE_INTERFACE_INDEX=$tsInterfaceIndex" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "TAILSCALE_IP=$tsIp" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 7. CONFIGURE RDP FIREWALL
      # ============================================================

      - name: 7. Configure RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'


          if (-not $env:TAILSCALE_INTERFACE) {
            throw "TAILSCALE_INTERFACE is missing."
          }


          if (-not $env:TAILSCALE_IP) {
            throw "TAILSCALE_IP is missing."
          }


          Write-Host "Configuring Windows Firewall..."
          Write-Host ""
          Write-Host "Tailscale interface:"
          Write-Host "  $env:TAILSCALE_INTERFACE"
          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host "  $env:TAILSCALE_IP"
          Write-Host ""


          # ----------------------------------------------------------
          # Verify Tailscale interface.
          # ----------------------------------------------------------

          $adapter = Get-NetAdapter `
            -Name $env:TAILSCALE_INTERFACE `
            -ErrorAction SilentlyContinue


          if (
            $null -eq $adapter -or
            $adapter.Status -ne 'Up'
          ) {
            throw "Tailscale interface is not active."
          }


          # ----------------------------------------------------------
          # Verify Tailscale IP belongs to this interface.
          # ----------------------------------------------------------

          $interfaceIp = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq $env:TAILSCALE_IP
            }


          if (-not $interfaceIp) {
            throw "Tailscale IPv4 is not assigned to the selected interface."
          }


          # ----------------------------------------------------------
          # Disable Windows' broad Remote Desktop rules.
          # ----------------------------------------------------------

          Disable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue


          # ----------------------------------------------------------
          # Remove our previous custom rules.
          # ----------------------------------------------------------

          @(
            'Cloud PC - RDP via Tailscale - TCP'
            'Cloud PC - RDP via Tailscale - UDP'
          ) |
          ForEach-Object {

            Get-NetFirewallRule `
              -DisplayName $_ `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule `
                -ErrorAction SilentlyContinue
          }


          # ----------------------------------------------------------
          # TCP 3389.
          # ----------------------------------------------------------

          New-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - TCP' `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any `
            -RemoteAddress '100.64.0.0/10' `
            -InterfaceAlias $env:TAILSCALE_INTERFACE |
            Out-Null


          # ----------------------------------------------------------
          # UDP 3389.
          # ----------------------------------------------------------

          New-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - UDP' `
            -Direction Inbound `
            -Protocol UDP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any `
            -RemoteAddress '100.64.0.0/10' `
            -InterfaceAlias $env:TAILSCALE_INTERFACE |
            Out-Null


          # ----------------------------------------------------------
          # Verify TCP rule.
          # ----------------------------------------------------------

          $tcpRule = Get-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - TCP' `
            -ErrorAction SilentlyContinue


          if (
            $null -eq $tcpRule -or
            $tcpRule.Enabled -ne $true -or
            $tcpRule.Action -ne 'Allow'
          ) {
            throw "Tailscale RDP TCP firewall rule is invalid."
          }


          # ----------------------------------------------------------
          # Verify UDP rule.
          # ----------------------------------------------------------

          $udpRule = Get-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - UDP' `
            -ErrorAction SilentlyContinue


          if (
            $null -eq $udpRule -or
            $udpRule.Enabled -ne $true -or
            $udpRule.Action -ne 'Allow'
          ) {
            throw "Tailscale RDP UDP firewall rule is invalid."
          }


          # ----------------------------------------------------------
          # Verify port filters.
          # ----------------------------------------------------------

          $tcpFilter = $tcpRule |
            Get-NetFirewallPortFilter


          $udpFilter = $udpRule |
            Get-NetFirewallPortFilter


          if (
            $tcpFilter.Protocol -ne 'TCP' -or
            $tcpFilter.LocalPort -notcontains '3389'
          ) {
            throw "TCP firewall rule has unexpected port/protocol."
          }


          if (
            $udpFilter.Protocol -ne 'UDP' -or
            $udpFilter.LocalPort -notcontains '3389'
          ) {
            throw "UDP firewall rule has unexpected port/protocol."
          }


          # ----------------------------------------------------------
          # Verify interface filters.
          # ----------------------------------------------------------

          $tcpInterfaceFilter = $tcpRule |
            Get-NetFirewallInterfaceFilter


          $udpInterfaceFilter = $udpRule |
            Get-NetFirewallInterfaceFilter


          if (
            $tcpInterfaceFilter.InterfaceAlias -notcontains
            $env:TAILSCALE_INTERFACE
          ) {
            throw "TCP firewall rule is not restricted to Tailscale interface."
          }


          if (
            $udpInterfaceFilter.InterfaceAlias -notcontains
            $env:TAILSCALE_INTERFACE
          ) {
            throw "UDP firewall rule is not restricted to Tailscale interface."
          }


          Write-Host ""
          Write-Host "RDP firewall configured successfully."
          Write-Host ""
          Write-Host "TCP/3389 -> Tailscale interface only"
          Write-Host "UDP/3389 -> Tailscale interface only"
          Write-Host "Allowed source -> 100.64.0.0/10"
          Write-Host "Interface       -> $env:TAILSCALE_INTERFACE"


      # ============================================================
      # 8. FINAL SYSTEM VERIFICATION
      # ============================================================

      - name: 8. Final System Verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $errors = @()


          function Check-Component {
            param(
              [string]$Name,
              [bool]$Condition
            )

            if ($Condition) {
              Write-Host "[OK]   $Name"
            }
            else {
              Write-Host "[FAIL] $Name"
              $script:errors += $Name
            }
          }


          Write-Host ""
          Write-Host "==============================================="
          Write-Host " FINAL SYSTEM CHECK"
          Write-Host "==============================================="
          Write-Host ""


          # ----------------------------------------------------------
          # RDP SERVICE
          # ----------------------------------------------------------

          $rdpService = Get-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue


          Check-Component `
            'Remote Desktop service' `
            (
              $null -ne $rdpService -and
              $rdpService.Status -eq 'Running'
            )


          # ----------------------------------------------------------
          # RDP USER
          # ----------------------------------------------------------

          $rdpUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue


          Check-Component `
            'RDP administrator' `
            ($null -ne $rdpUser)


          # ----------------------------------------------------------
          # GROUP MEMBERSHIP BY SID
          # ----------------------------------------------------------

          $userSid = $null

          if ($rdpUser) {
            $userSid = $rdpUser.SID.Value
          }


          $adminMembership = $false

          if ($userSid) {

            $adminMembership = @(
              Get-LocalGroupMember `
                -Group 'Administrators' `
                -ErrorAction SilentlyContinue
            ) |
            Where-Object {
              $_.SID.Value -eq $userSid
            } |
            Select-Object -First 1
          }


          Check-Component `
            'Administrator group membership' `
            ($null -ne $adminMembership)


          $rdpMembership = $false

          if ($userSid) {

            $rdpMembership = @(
              Get-LocalGroupMember `
                -Group 'Remote Desktop Users' `
                -ErrorAction SilentlyContinue
            ) |
            Where-Object {
              $_.SID.Value -eq $userSid
            } |
            Select-Object -First 1
          }


          Check-Component `
            'Remote Desktop Users membership' `
            ($null -ne $rdpMembership)


          # ----------------------------------------------------------
          # TAILSCALE EXECUTABLE
          # ----------------------------------------------------------

          $tailscale = Join-Path `
            $env:ProgramFiles `
            'Tailscale\tailscale.exe'


          Check-Component `
            'Tailscale executable' `
            (Test-Path $tailscale)


          # ----------------------------------------------------------
          # TAILSCALE INTERFACE
          # ----------------------------------------------------------

          $tsAdapter = Get-NetAdapter `
            -Name $env:TAILSCALE_INTERFACE `
            -ErrorAction SilentlyContinue


          Check-Component `
            'Tailscale network interface' `
            (
              $null -ne $tsAdapter -and
              $tsAdapter.Status -eq 'Up'
            )


          # ----------------------------------------------------------
          # TAILSCALE IPv4
          # ----------------------------------------------------------

          $tsIpValid =
            $env:TAILSCALE_IP -match `
            '^100\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}$'


          Check-Component `
            'Tailscale IPv4' `
            $tsIpValid


          # ----------------------------------------------------------
          # VERIFY IP ON INTERFACE
          # ----------------------------------------------------------

          $interfaceIpValid = $false

          if ($tsAdapter -and $env:TAILSCALE_IP) {

            $interfaceIpValid = $null -ne (
              Get-NetIPAddress `
                -InterfaceIndex $tsAdapter.ifIndex `
                -AddressFamily IPv4 `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.IPAddress -eq $env:TAILSCALE_IP
                } |
                Select-Object -First 1
            )
          }


          Check-Component `
            'Tailscale IPv4 assigned to interface' `
            $interfaceIpValid


          # ----------------------------------------------------------
          # TCP FIREWALL RULE
          # ----------------------------------------------------------

          $tcpRule = Get-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - TCP' `
            -ErrorAction SilentlyContinue


          $tcpValid = (
            $null -ne $tcpRule -and
            $tcpRule.Enabled -eq $true -and
            $tcpRule.Action -eq 'Allow'
          )


          Check-Component `
            'Tailscale RDP TCP firewall rule' `
            $tcpValid


          # ----------------------------------------------------------
          # UDP FIREWALL RULE
          # ----------------------------------------------------------

          $udpRule = Get-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - UDP' `
            -ErrorAction SilentlyContinue


          $udpValid = (
            $null -ne $udpRule -and
            $udpRule.Enabled -eq $true -and
            $udpRule.Action -eq 'Allow'
          )


          Check-Component `
            'Tailscale RDP UDP firewall rule' `
            $udpValid


          # ----------------------------------------------------------
          # RDP TCP LISTENER
          # ----------------------------------------------------------

          $rdpListening = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue


          Check-Component `
            'RDP TCP/3389 listener' `
            ($null -ne $rdpListening)


          # ----------------------------------------------------------
          # FINAL RESULT
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "==============================================="


          if ($errors.Count -gt 0) {

            Write-Host ""
            Write-Host "SYSTEM CHECK FAILED:"
            Write-Host ""

            $errors |
              ForEach-Object {
                Write-Host " - $_"
              }

            throw "Cloud PC setup failed."
          }


          Write-Host ""
          Write-Host "All required components are ready."
          Write-Host ""


      # ============================================================
      # 9. CLOUD PC READY
      # ============================================================

      - name: 9. Cloud PC Ready
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================================="
          Write-Host "                  WINDOWS CLOUD PC READY"
          Write-Host "=============================================================="
          Write-Host ""

          Write-Host "Tailscale IP       : $env:TAILSCALE_IP"
          Write-Host "Tailscale Interface: $env:TAILSCALE_INTERFACE"

          # GitHub masks these values.
          Write-Host "Username           : $env:RDP_USERNAME"
          Write-Host "Password           : $env:RDP_PASSWORD"

          Write-Host ""
          Write-Host "RDP target:"
          Write-Host "  $env:TAILSCALE_IP"

          Write-Host ""
          Write-Host "RDP port:"
          Write-Host "  3389 TCP + UDP"

          Write-Host ""
          Write-Host "Connect from Windows using:"
          Write-Host "  mstsc.exe"

          Write-Host ""
          Write-Host "Environment:"
          Write-Host "  [OK] Windows"
          Write-Host "  [OK] Remote Desktop"
          Write-Host "  [OK] Local Administrator"
          Write-Host "  [OK] Tailscale"
          Write-Host "  [OK] Tailscale-only RDP TCP Firewall"
          Write-Host "  [OK] Tailscale-only RDP UDP Firewall"

          Write-Host ""
          Write-Host "No additional applications were installed."
          Write-Host "Install required software manually after connecting."
          Write-Host ""

          Write-Host "=============================================================="


      # ============================================================
      # 10. KEEP CLOUD PC ALIVE
      # ============================================================

      - name: 10. Keep Cloud PC Alive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'


          Write-Host ""
          Write-Host "Cloud PC is running."
          Write-Host ""


          # ----------------------------------------------------------
          # Runtime policy.
          #
          # GitHub Actions timeout:
          #   360 minutes
          #
          # Safety margin:
          #   15 minutes
          #
          # Maximum total workflow runtime target:
          #   345 minutes
          #
          # The timer started in step 1, so all setup time is included.
          # ----------------------------------------------------------

          $jobTimeoutMinutes = 360
          $safetyMarginMinutes = 15

          $maximumRuntimeMinutes =
            $jobTimeoutMinutes - $safetyMarginMinutes


          if ($maximumRuntimeMinutes -le 0) {
            throw "Invalid runtime configuration."
          }


          # ----------------------------------------------------------
          # Recover global start timestamp.
          # ----------------------------------------------------------

          if (-not $env:CLOUD_PC_START_UTC) {
            throw "Cloud PC start timestamp is missing."
          }


          try {

            $jobStart =
              [DateTimeOffset]::Parse(
                $env:CLOUD_PC_START_UTC
              )

          }
          catch {

            throw (
              "Invalid Cloud PC start timestamp: " +
              $env:CLOUD_PC_START_UTC
            )
          }


          # ----------------------------------------------------------
          # Calculate global deadline.
          # ----------------------------------------------------------

          $deadline =
            $jobStart.AddMinutes(
              $maximumRuntimeMinutes
            )


          $now =
            [DateTimeOffset]::UtcNow


          $elapsed =
            $now - $jobStart


          $remaining =
            $deadline - $now


          if ($remaining.TotalSeconds -le 0) {

            throw (
              "The setup consumed the complete allowed runtime. " +
              "Elapsed: {0:N1} minutes." -f
              $elapsed.TotalMinutes
            )
          }


          Write-Host "Cloud PC start (UTC):"
          Write-Host "  $($jobStart.ToString('o'))"

          Write-Host ""
          Write-Host "Current time (UTC):"
          Write-Host "  $($now.ToString('o'))"

          Write-Host ""
          Write-Host "Job timeout:"
          Write-Host "  $jobTimeoutMinutes minutes"

          Write-Host ""
          Write-Host "Safety margin:"
          Write-Host "  $safetyMarginMinutes minutes"

          Write-Host ""
          Write-Host "Maximum total runtime:"
          Write-Host "  $maximumRuntimeMinutes minutes"

          Write-Host ""
          Write-Host "Elapsed setup/runtime:"
          Write-Host "  $([math]::Round($elapsed.TotalMinutes, 1)) minutes"

          Write-Host ""
          Write-Host "Cloud PC deadline (UTC):"
          Write-Host "  $($deadline.ToString('o'))"

          Write-Host ""
          Write-Host "Remaining:"
          Write-Host "  $([math]::Round($remaining.TotalMinutes, 1)) minutes"

          Write-Host ""


          # ----------------------------------------------------------
          # Keep runner alive until global deadline.
          # ----------------------------------------------------------

          while ($true) {

            $current =
              [DateTimeOffset]::UtcNow


            $remaining =
              $deadline - $current


            if ($remaining.TotalSeconds -le 0) {
              break
            }


            $elapsed =
              $current - $jobStart


            Write-Host (
              "[{0}] Cloud PC running | Elapsed: {1} | Remaining: {2}" -f `
              $current.ToString('yyyy-MM-dd HH:mm:ss'),
              $elapsed.ToString('dd\:hh\:mm\:ss'),
              $remaining.ToString('dd\:hh\:mm\:ss')
            )


            # Never sleep beyond the calculated deadline.
            $sleepSeconds = [int][math]::Min(
              60,
              [math]::Max(
                1,
                [math]::Floor(
                  $remaining.TotalSeconds
                )
              )
            )


            Start-Sleep `
              -Seconds $sleepSeconds
          }


          Write-Host ""
          Write-Host "Keep-alive period completed."
          Write-Host "15-minute safety margin preserved."
          Write-Host "GitHub Actions job is ending normally."
