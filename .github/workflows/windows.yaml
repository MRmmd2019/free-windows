name: 🖥️ Windows Cloud PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  cloud-pc:

    name: 🖥️ Windows Cloud PC
    runs-on: windows-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: "1️⃣ 🖥️ System Information"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║              🖥️ WINDOWS CLOUD PC                           ║"
          Write-Host "║              🔍 SYSTEM INFORMATION                         ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          try {

            $cloudPcStartUtc = [DateTimeOffset]::UtcNow

            "CLOUD_PC_START_UTC=$($cloudPcStartUtc.ToString('o'))" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            Write-Host "🕐 Cloud PC start time (UTC):"
            Write-Host "   $($cloudPcStartUtc.ToString('o'))"
            Write-Host ""

            Write-Host "🪟 Windows information:"
            Write-Host ""

            $computerInfo = Get-ComputerInfo |
              Select-Object `
                WindowsProductName,
                WindowsVersion,
                OsBuildNumber,
                CsProcessors,
                CsTotalPhysicalMemory

            $computerInfo | Format-List

            Write-Host ""
            Write-Host "⚙️ PowerShell:"
            Write-Host "   Version: $($PSVersionTable.PSVersion)"
            Write-Host ""

            Write-Host "💾 Disk information:"
            Write-Host ""

            Get-Volume |
              Where-Object DriveLetter |
              Select-Object `
                DriveLetter,
                FileSystemLabel,
                FileSystem,
                SizeRemaining,
                Size |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "✅ System information collected successfully."
            Write-Host ""

          }
          catch {

            Write-Host ""
            Write-Host "❌ ERROR: Failed to collect system information."
            Write-Host "📄 Details:"
            Write-Host "   $($_.Exception.Message)"
            Write-Host ""

            throw
          }


      # ============================================================
      # 2. GENERATE RDP CREDENTIALS
      # ============================================================

      - name: "2️⃣ 🔐 Generate RDP Credentials"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║              🔐 RDP CREDENTIAL GENERATION                  ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          function Get-RandomChar {

            param(
              [Parameter(Mandatory)]
              [string]$Characters
            )

            $index = Get-Random `
              -Minimum 0 `
              -Maximum $Characters.Length

            return $Characters[$index]
          }


          function New-RandomUsername {

            $letters = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
            $digits  = '23456789'

            $username = 'CloudPC_'

            1..10 | ForEach-Object {
              $username += Get-RandomChar -Characters $letters
            }

            $username += Get-RandomChar -Characters $digits

            return $username
          }


          function New-RandomPassword {

            $upper   = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
            $lower   = 'abcdefghijkmnopqrstuvwxyz'
            $digits  = '23456789'
            $special = '!@#$%^&*_-+=?'

            $all = $upper + $lower + $digits + $special

            $chars = @()

            $chars += Get-RandomChar -Characters $upper
            $chars += Get-RandomChar -Characters $lower
            $chars += Get-RandomChar -Characters $digits
            $chars += Get-RandomChar -Characters $special

            1..28 | ForEach-Object {
              $chars += Get-RandomChar -Characters $all
            }

            return (-join (
              $chars |
                Sort-Object { Get-Random }
            ))
          }


          try {

            Write-Host "🔄 Generating random RDP username..."
            $username = New-RandomUsername

            Write-Host "✅ Username generated."
            Write-Host ""

            Write-Host "🔄 Generating secure random RDP password..."
            $password = New-RandomPassword

            Write-Host "✅ Password generated."
            Write-Host ""

            "RDP_USERNAME=$username" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            "RDP_PASSWORD=$password" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            Write-Host "╔══════════════════════════════════════════════════════════════╗"
            Write-Host "║                  🔐 RDP LOGIN INFORMATION                  ║"
            Write-Host "╠══════════════════════════════════════════════════════════════╣"
            Write-Host "║                                                              ║"
            Write-Host "║  👤 Username: $username"
            Write-Host "║                                                              ║"
            Write-Host "║  🔑 Password: $password"
            Write-Host "║                                                              ║"
            Write-Host "╚══════════════════════════════════════════════════════════════╝"
            Write-Host ""

            Write-Host "⚠️ IMPORTANT:"
            Write-Host "   These credentials are intentionally visible in the log."
            Write-Host "   Use them only for this temporary Cloud PC."
            Write-Host ""

            Write-Host "✅ RDP credentials are ready."

          }
          catch {

            Write-Host ""
            Write-Host "❌ ERROR: Failed to generate RDP credentials."
            Write-Host "📄 Details:"
            Write-Host "   $($_.Exception.Message)"
            Write-Host ""

            throw
          }


      # ============================================================
      # 3. ENABLE REMOTE DESKTOP
      # ============================================================

      - name: "3️⃣ 🖥️ Enable Remote Desktop"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║                 🖥️ REMOTE DESKTOP (RDP)                   ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          try {

            Write-Host "🔄 Enabling Remote Desktop connections..."

            Set-ItemProperty `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
              -Name 'fDenyTSConnections' `
              -Value 0

            Write-Host "   ✅ RDP connections enabled."

            Write-Host "🔄 Configuring RDP authentication..."

            Set-ItemProperty `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
              -Name 'UserAuthentication' `
              -Value 1

            Write-Host "   ✅ Network Level Authentication enabled."

            Write-Host "🔄 Configuring Remote Desktop service..."

            Set-Service `
              -Name 'TermService' `
              -StartupType Automatic

            Start-Service `
              -Name 'TermService' `
              -ErrorAction SilentlyContinue

            Write-Host "   ✅ Remote Desktop service started."

            $service = Get-Service `
              -Name 'TermService' `
              -ErrorAction SilentlyContinue

            if (
              $null -eq $service -or
              $service.Status -ne 'Running'
            ) {

              throw "Remote Desktop service is not running."
            }

            Write-Host ""
            Write-Host "✅ Remote Desktop is fully enabled."
            Write-Host ""

          }
          catch {

            Write-Host ""
            Write-Host "❌ ERROR: Could not enable Remote Desktop."
            Write-Host "📄 Details:"
            Write-Host "   $($_.Exception.Message)"
            Write-Host ""

            throw
          }


      # ============================================================
      # 4. CREATE LOCAL ADMINISTRATOR
      # ============================================================

      - name: "4️⃣ 👤 Create RDP Administrator"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║                👤 RDP USER CONFIGURATION                   ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          try {

            $username = $env:RDP_USERNAME
            $password = $env:RDP_PASSWORD

            if (-not $username -or -not $password) {
              throw "RDP credentials are missing from the environment."
            }

            Write-Host "👤 Username:"
            Write-Host "   $username"
            Write-Host ""

            Write-Host "🔄 Creating local Windows account..."

            $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

            $existingUser = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

            if (-not $existingUser) {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName 'Cloud PC Administrator' `
                -Description 'Temporary Windows Cloud PC administrator' `
                -PasswordNeverExpires `
                -AccountNeverExpires |
                Out-Null

              Write-Host "   ✅ Local user created."

            }
            else {

              Write-Host "   ℹ️ User already exists."
              Write-Host "   🔄 Updating password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Write-Host "   ✅ Password updated."
            }


            $localUser = Get-LocalUser `
              -Name $username `
              -ErrorAction Stop

            $userSid = $localUser.SID.Value


            Write-Host ""
            Write-Host "🔄 Checking Administrators group..."

            $adminMember = Get-LocalGroupMember `
              -Group 'Administrators' `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.SID.Value -eq $userSid
              }

            if (-not $adminMember) {

              Add-LocalGroupMember `
                -Group 'Administrators' `
                -Member $username `
                -ErrorAction Stop

              Write-Host "   ✅ User added to Administrators."

            }
            else {

              Write-Host "   ✅ User is already an Administrator."
            }


            Write-Host ""
            Write-Host "🔄 Checking Remote Desktop Users group..."

            $rdpMember = Get-LocalGroupMember `
              -Group 'Remote Desktop Users' `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.SID.Value -eq $userSid
              }

            if (-not $rdpMember) {

              Add-LocalGroupMember `
                -Group 'Remote Desktop Users' `
                -Member $username `
                -ErrorAction Stop

              Write-Host "   ✅ User added to Remote Desktop Users."

            }
            else {

              Write-Host "   ✅ User is already in Remote Desktop Users."
            }


            $userCheck = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

            if (-not $userCheck) {
              throw "RDP user creation failed."
            }

            Write-Host ""
            Write-Host "╔══════════════════════════════════════════════════════════════╗"
            Write-Host "║              ✅ RDP USER READY                              ║"
            Write-Host "╚══════════════════════════════════════════════════════════════╝"
            Write-Host ""

          }
          catch {

            Write-Host ""
            Write-Host "❌ ERROR: Failed to configure RDP administrator."
            Write-Host "📄 Details:"
            Write-Host "   $($_.Exception.Message)"
            Write-Host ""

            throw
          }


      # ============================================================
      # 5. CONNECT TAILSCALE
      # ============================================================

      - name: "5️⃣ 🟦 Connect Tailscale"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
          log-mode: normal


      # ============================================================
      # 6. DETECT TAILSCALE
      # ============================================================

      - name: "6️⃣ 🌐 Detect Tailscale Network"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║                 🌐 TAILSCALE NETWORK                       ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          try {

            $tailscale = Join-Path `
              $env:ProgramFiles `
              'Tailscale\tailscale.exe'

            if (-not (Test-Path $tailscale)) {
              throw "Tailscale executable was not found."
            }

            Write-Host "✅ Tailscale executable found."
            Write-Host ""

            Write-Host "🔄 Waiting for Tailscale network..."

            $tsIp = $null
            $tailscaleAdapter = $null


            for ($i = 1; $i -le 30; $i++) {

              Write-Host ""
              Write-Host "   🔄 Attempt $i / 30"

              $result = & $tailscale ip -4 2>$null

              $candidate = $result |
                Where-Object {
                  $_ -match '^100\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}$'
                } |
                Select-Object -First 1

              if ($candidate) {
                $tsIp = $candidate.Trim()
                Write-Host "   ✅ Tailscale IPv4 detected: $tsIp"
              }

              $tailscaleAdapter = Get-NetAdapter `
                -ErrorAction SilentlyContinue |
                Where-Object {

                  $_.Status -eq 'Up' -and (
                    $_.Name -match '(?i)tailscale' -or
                    $_.InterfaceDescription -match '(?i)tailscale'
                  )

                } |
                Select-Object -First 1

              if ($tailscaleAdapter) {
                Write-Host "   ✅ Tailscale network adapter detected."
                Write-Host "      Name: $($tailscaleAdapter.Name)"
                Write-Host "      Index: $($tailscaleAdapter.ifIndex)"
              }

              if ($tsIp -and $tailscaleAdapter) {
                break
              }

              Write-Host "   ⏳ Network is not ready yet..."
              Start-Sleep -Seconds 2
            }


            if (-not $tailscaleAdapter) {
              throw "No active Tailscale network interface was found."
            }

            if (-not $tsIp) {
              throw "Could not obtain Tailscale IPv4 address."
            }


            if (
              $tsIp -notmatch
              '^100\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}$'
            ) {
              throw "Unexpected Tailscale IPv4 address: $tsIp"
            }


            $interfaceIp = Get-NetIPAddress `
              -InterfaceIndex $tailscaleAdapter.ifIndex `
              -AddressFamily IPv4 `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.IPAddress -eq $tsIp
              }

            if (-not $interfaceIp) {

              throw `
                "Tailscale IPv4 is not assigned to the detected Tailscale interface."
            }


            $tsInterfaceAlias = $tailscaleAdapter.Name
            $tsInterfaceIndex = $tailscaleAdapter.ifIndex


            "TAILSCALE_INTERFACE=$tsInterfaceAlias" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            "TAILSCALE_INTERFACE_INDEX=$tsInterfaceIndex" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            "TAILSCALE_IP=$tsIp" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append


            Write-Host ""
            Write-Host "╔══════════════════════════════════════════════════════════════╗"
            Write-Host "║              ✅ TAILSCALE CONNECTED                        ║"
            Write-Host "╠══════════════════════════════════════════════════════════════╣"
            Write-Host "║ 🌐 IPv4      : $tsIp"
            Write-Host "║ 🔌 Interface  : $tsInterfaceAlias"
            Write-Host "║ 🔢 Index      : $tsInterfaceIndex"
            Write-Host "╚══════════════════════════════════════════════════════════════╝"
            Write-Host ""

          }
          catch {

            Write-Host ""
            Write-Host "❌ ERROR: Tailscale network detection failed."
            Write-Host "📄 Details:"
            Write-Host "   $($_.Exception.Message)"
            Write-Host ""

            throw
          }


      # ============================================================
      # 7. CONFIGURE RDP FIREWALL
      # ============================================================

      - name: "7️⃣ 🛡️ Configure RDP Firewall"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║                 🛡️ WINDOWS FIREWALL                       ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          try {

            if (-not $env:TAILSCALE_INTERFACE) {
              throw "TAILSCALE_INTERFACE is missing."
            }

            if (-not $env:TAILSCALE_IP) {
              throw "TAILSCALE_IP is missing."
            }


            Write-Host "🌐 Tailscale interface:"
            Write-Host "   $env:TAILSCALE_INTERFACE"
            Write-Host ""

            Write-Host "🌐 Tailscale IPv4:"
            Write-Host "   $env:TAILSCALE_IP"
            Write-Host ""


            $adapter = Get-NetAdapter `
              -Name $env:TAILSCALE_INTERFACE `
              -ErrorAction SilentlyContinue

            if (
              $null -eq $adapter -or
              $adapter.Status -ne 'Up'
            ) {
              throw "Tailscale interface is not active."
            }

            Write-Host "✅ Tailscale interface is active."
            Write-Host ""


            Write-Host "🔄 Verifying Tailscale IP..."

            $interfaceIp = Get-NetIPAddress `
              -InterfaceIndex $adapter.ifIndex `
              -AddressFamily IPv4 `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.IPAddress -eq $env:TAILSCALE_IP
              }

            if (-not $interfaceIp) {
              throw "Tailscale IPv4 is not assigned to the selected interface."
            }

            Write-Host "   ✅ Tailscale IP is correctly assigned."
            Write-Host ""


            Write-Host "🔄 Disabling Windows default Remote Desktop firewall rules..."

            Disable-NetFirewallRule `
              -DisplayGroup 'Remote Desktop' `
              -ErrorAction SilentlyContinue

            Write-Host "   ✅ Default RDP firewall rules processed."
            Write-Host ""


            Write-Host "🔄 Removing old Cloud PC firewall rules..."

            @(
              'Cloud PC - RDP via Tailscale - TCP'
              'Cloud PC - RDP via Tailscale - UDP'
            ) |
            ForEach-Object {

              Get-NetFirewallRule `
                -DisplayName $_ `
                -ErrorAction SilentlyContinue |
                Remove-NetFirewallRule `
                  -ErrorAction SilentlyContinue
            }

            Write-Host "   ✅ Old rules removed."
            Write-Host ""


            Write-Host "🔄 Creating TCP/3389 Tailscale firewall rule..."

            New-NetFirewallRule `
              -DisplayName 'Cloud PC - RDP via Tailscale - TCP' `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any `
              -RemoteAddress '100.64.0.0/10' `
              -InterfaceAlias $env:TAILSCALE_INTERFACE |
              Out-Null

            Write-Host "   ✅ TCP/3389 rule created."
            Write-Host ""


            Write-Host "🔄 Creating UDP/3389 Tailscale firewall rule..."

            New-NetFirewallRule `
              -DisplayName 'Cloud PC - RDP via Tailscale - UDP' `
              -Direction Inbound `
              -Protocol UDP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any `
              -RemoteAddress '100.64.0.0/10' `
              -InterfaceAlias $env:TAILSCALE_INTERFACE |
              Out-Null

            Write-Host "   ✅ UDP/3389 rule created."
            Write-Host ""


            $tcpRule = Get-NetFirewallRule `
              -DisplayName 'Cloud PC - RDP via Tailscale - TCP' `
              -ErrorAction SilentlyContinue

            if (
              $null -eq $tcpRule -or
              $tcpRule.Enabled -ne $true -or
              $tcpRule.Action -ne 'Allow'
            ) {
              throw "TCP firewall rule validation failed."
            }


            $udpRule = Get-NetFirewallRule `
              -DisplayName 'Cloud PC - RDP via Tailscale - UDP' `
              -ErrorAction SilentlyContinue

            if (
              $null -eq $udpRule -or
              $udpRule.Enabled -ne $true -or
              $udpRule.Action -ne 'Allow'
            ) {
              throw "UDP firewall rule validation failed."
            }


            Write-Host "╔══════════════════════════════════════════════════════════════╗"
            Write-Host "║                ✅ FIREWALL READY                           ║"
            Write-Host "╠══════════════════════════════════════════════════════════════╣"
            Write-Host "║ 🔵 TCP 3389  → Allowed via Tailscale"
            Write-Host "║ 🟣 UDP 3389  → Allowed via Tailscale"
            Write-Host "║ 🌐 Source    → 100.64.0.0/10"
            Write-Host "║ 🔌 Interface → $env:TAILSCALE_INTERFACE"
            Write-Host "╚══════════════════════════════════════════════════════════════╝"
            Write-Host ""

          }
          catch {

            Write-Host ""
            Write-Host "❌ ERROR: Windows Firewall configuration failed."
            Write-Host "📄 Details:"
            Write-Host "   $($_.Exception.Message)"
            Write-Host ""

            throw
          }


      # ============================================================
      # 8. FINAL SYSTEM VERIFICATION
      # ============================================================

      - name: "8️⃣ 🔎 Final System Verification"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║                 🔎 FINAL SYSTEM CHECK                       ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          $errors = @()


          function Check-Component {

            param(
              [string]$Name,
              [bool]$Condition
            )

            if ($Condition) {

              Write-Host "   ✅ $Name"

            }
            else {

              Write-Host "   ❌ $Name"
              $script:errors += $Name
            }
          }


          Write-Host "🖥️ Remote Desktop"
          Write-Host "────────────────────────────────────────"

          $rdpService = Get-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          Check-Component `
            'Remote Desktop service is running' `
            (
              $null -ne $rdpService -and
              $rdpService.Status -eq 'Running'
            )


          Write-Host ""
          Write-Host "👤 RDP Account"
          Write-Host "────────────────────────────────────────"

          $rdpUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Check-Component `
            'RDP administrator exists' `
            ($null -ne $rdpUser)


          $userSid = $null

          if ($rdpUser) {
            $userSid = $rdpUser.SID.Value
          }


          $adminMembership = $false

          if ($userSid) {

            $adminMembership = @(
              Get-LocalGroupMember `
                -Group 'Administrators' `
                -ErrorAction SilentlyContinue
            ) |
            Where-Object {
              $_.SID.Value -eq $userSid
            } |
            Select-Object -First 1
          }

          Check-Component `
            'User belongs to Administrators' `
            ($null -ne $adminMembership)


          $rdpMembership = $false

          if ($userSid) {

            $rdpMembership = @(
              Get-LocalGroupMember `
                -Group 'Remote Desktop Users' `
                -ErrorAction SilentlyContinue
            ) |
            Where-Object {
              $_.SID.Value -eq $userSid
            } |
            Select-Object -First 1
          }

          Check-Component `
            'User belongs to Remote Desktop Users' `
            ($null -ne $rdpMembership)


          Write-Host ""
          Write-Host "🌐 Tailscale"
          Write-Host "────────────────────────────────────────"

          $tailscale = Join-Path `
            $env:ProgramFiles `
            'Tailscale\tailscale.exe'

          Check-Component `
            'Tailscale executable exists' `
            (Test-Path $tailscale)


          $tsAdapter = Get-NetAdapter `
            -Name $env:TAILSCALE_INTERFACE `
            -ErrorAction SilentlyContinue

          Check-Component `
            'Tailscale network interface is UP' `
            (
              $null -ne $tsAdapter -and
              $tsAdapter.Status -eq 'Up'
            )


          $tsIpValid =
            $env:TAILSCALE_IP -match `
            '^100\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}$'

          Check-Component `
            'Tailscale IPv4 is valid' `
            $tsIpValid


          $interfaceIpValid = $false

          if ($tsAdapter -and $env:TAILSCALE_IP) {

            $interfaceIpValid = $null -ne (
              Get-NetIPAddress `
                -InterfaceIndex $tsAdapter.ifIndex `
                -AddressFamily IPv4 `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.IPAddress -eq $env:TAILSCALE_IP
                } |
                Select-Object -First 1
            )
          }

          Check-Component `
            'Tailscale IPv4 is assigned to interface' `
            $interfaceIpValid


          Write-Host ""
          Write-Host "🛡️ Firewall"
          Write-Host "────────────────────────────────────────"

          $tcpRule = Get-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - TCP' `
            -ErrorAction SilentlyContinue

          $tcpValid = (
            $null -ne $tcpRule -and
            $tcpRule.Enabled -eq $true -and
            $tcpRule.Action -eq 'Allow'
          )

          Check-Component `
            'TCP/3389 firewall rule is enabled' `
            $tcpValid


          $udpRule = Get-NetFirewallRule `
            -DisplayName 'Cloud PC - RDP via Tailscale - UDP' `
            -ErrorAction SilentlyContinue

          $udpValid = (
            $null -ne $udpRule -and
            $udpRule.Enabled -eq $true -and
            $udpRule.Action -eq 'Allow'
          )

          Check-Component `
            'UDP/3389 firewall rule is enabled' `
            $udpValid


          Write-Host ""
          Write-Host "🔌 RDP Listener"
          Write-Host "────────────────────────────────────────"

          $rdpListening = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          Check-Component `
            'TCP/3389 is listening' `
            ($null -ne $rdpListening)


          Write-Host ""
          Write-Host "══════════════════════════════════════════════════════════════"

          if ($errors.Count -gt 0) {

            Write-Host ""
            Write-Host "❌ FINAL CHECK FAILED"
            Write-Host ""
            Write-Host "The following components have problems:"
            Write-Host ""

            $errors |
              ForEach-Object {
                Write-Host "   ❌ $_"
              }

            Write-Host ""
            Write-Host "🛑 Cloud PC will NOT be marked as ready."
            Write-Host ""

            throw "Cloud PC final verification failed."
          }


          Write-Host ""
          Write-Host "🎉 ALL SYSTEM CHECKS PASSED!"
          Write-Host ""
          Write-Host "✅ Windows"
          Write-Host "✅ Remote Desktop"
          Write-Host "✅ RDP Administrator"
          Write-Host "✅ Tailscale"
          Write-Host "✅ Tailscale IPv4"
          Write-Host "✅ Firewall"
          Write-Host "✅ TCP/3389 listener"
          Write-Host ""


