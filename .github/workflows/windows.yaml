      # ============================================================
      # 10. KEEP CLOUD PC ALIVE
      # ============================================================

      - name: "🔟 ⏱️ Keep Cloud PC Alive"
        shell: pwsh
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║                 ⏱️ CLOUD PC KEEP-ALIVE                      ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""

          $jobTimeoutMinutes = 360
          $safetyMarginMinutes = 15

          $maximumRuntimeMinutes =
            $jobTimeoutMinutes - $safetyMarginMinutes


          if ($maximumRuntimeMinutes -le 0) {
            throw "Invalid runtime configuration."
          }


          if (-not $env:CLOUD_PC_START_UTC) {
            throw "Cloud PC start timestamp is missing."
          }


          try {

            $jobStart =
              [DateTimeOffset]::Parse(
                $env:CLOUD_PC_START_UTC
              )

          }
          catch {

            throw (
              "Invalid Cloud PC start timestamp: " +
              $env:CLOUD_PC_START_UTC
            )
          }


          $deadline =
            $jobStart.AddMinutes(
              $maximumRuntimeMinutes
            )


          $now =
            [DateTimeOffset]::UtcNow


          $elapsed =
            $now - $jobStart


          $remaining =
            $deadline - $now


          if ($remaining.TotalSeconds -le 0) {

            throw (
              "The setup consumed the complete allowed runtime. " +
              "Elapsed: {0:N1} minutes." -f
              $elapsed.TotalMinutes
            )
          }


          Write-Host "🟢 Cloud PC is running."
          Write-Host ""

          Write-Host "🕐 Start time (UTC):"
          Write-Host "   $($jobStart.ToString('o'))"
          Write-Host ""

          Write-Host "⏱️ GitHub Actions timeout:"
          Write-Host "   $jobTimeoutMinutes minutes"
          Write-Host ""

          Write-Host "🛡️ Safety margin:"
          Write-Host "   $safetyMarginMinutes minutes"
          Write-Host ""

          Write-Host "⌛ Maximum runtime:"
          Write-Host "   $maximumRuntimeMinutes minutes"
          Write-Host ""

          Write-Host "📊 Already elapsed:"
          Write-Host "   $([math]::Round($elapsed.TotalMinutes, 1)) minutes"
          Write-Host ""

          Write-Host "🏁 Planned deadline (UTC):"
          Write-Host "   $($deadline.ToString('o'))"
          Write-Host ""

          Write-Host "⏳ Remaining:"
          Write-Host "   $([math]::Round($remaining.TotalMinutes, 1)) minutes"
          Write-Host ""


          while ($true) {

            $current =
              [DateTimeOffset]::UtcNow

            $remaining =
              $deadline - $current

            if ($remaining.TotalSeconds -le 0) {
              break
            }


            $elapsed =
              $current - $jobStart


            Write-Host (
              "🟢 [{0}] Cloud PC RUNNING | ⏱️ Elapsed: {1} | ⏳ Remaining: {2}" -f `
              $current.ToString('yyyy-MM-dd HH:mm:ss'),
              $elapsed.ToString('dd\:hh\:mm\:ss'),
              $remaining.ToString('dd\:hh\:mm\:ss')
            )


            $sleepSeconds = [int][math]::Min(
              60,
              [math]::Max(
                1,
                [math]::Floor(
                  $remaining.TotalSeconds
                )
              )
            )


            Start-Sleep `
              -Seconds $sleepSeconds
          }


          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗"
          Write-Host "║                  ⏰ SESSION FINISHED                        ║"
          Write-Host "╚══════════════════════════════════════════════════════════════╝"
          Write-Host ""
          Write-Host "ℹ️ Keep-alive period completed."
          Write-Host "🛡️ 15-minute safety margin was preserved."
          Write-Host "🏁 GitHub Actions job is ending."
          Write-Host ""
